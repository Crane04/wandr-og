<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Nitro Racing</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: radial-gradient(circle at 50% 20%, #1a2a52, #060a18 65%, #020308 100%);
        color: #fff;
        font-family: "Baloo 2", Arial, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        overflow-y: auto;
        overflow-x: hidden;
      }
      h1, .display-font { font-family: "Bangers", cursive; letter-spacing: 2px; }
      /* The lobby has grown (track picker + condition picker rows) well past
         a single screen on most viewports. Flex-centering an oversized child
         under overflow:hidden clips both ends with no way to reach them —
         scrolling the body (above) plus top/bottom padding here (instead of
         vertical centering) is what actually makes all of it reachable. */
      #lobby { text-align: center; max-width: 560px; width: 100%; padding: 32px 16px 130px; }
      #lobby h1 { font-size: 52px; color: #ffd23f; text-shadow: 0 0 18px rgba(255,178,0,.55), 3px 3px 0 #d1420c; margin-bottom: 6px; }
      #lobby p { color: #bcd0ff; }
      #roomCode { font-size: 44px; letter-spacing: 8px; color: #7fffa0; margin: 12px 0; font-family: "Bangers", cursive; text-shadow: 0 0 12px rgba(120,255,150,.6); }
      #qrcode { background: #fff; padding: 10px; display: inline-block; border-radius: 10px; }
      button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 10px; font-family: "Baloo 2", sans-serif; font-weight: 800; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
      button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.35); }
      #twoBtn { background: linear-gradient(180deg,#ffe066,#ffb300); color: #402700; }
      #aiBtn { background: linear-gradient(180deg,#7dffb0,#12b866); color: #063017; }
      #timerBtn { background: linear-gradient(180deg,#ff9a5a,#e0561a); color: #3a1400; }
      #fullscreenBtn { background: #1a2f66; color: #cfe1ff; border: 1px solid #5689e8; box-shadow: none; padding: 12px 16px; }
      button:disabled { opacity: .4; cursor: not-allowed; }
      #players { margin-top: 10px; color: #7fe8ff; font-weight: 700; }

      /* Pinned to the bottom of the viewport instead of living at the end of
         the scrolling lobby content — with a track picker and a conditions
         picker between the top of the page and the Play buttons, "scroll
         past everything to find Play" was the actual complaint. This keeps
         the primary action reachable in one tap no matter how far down
         someone has scrolled through the pickers. `#lobby` gets matching
         bottom padding (below) so this bar never covers its last row. */
      #playBar {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 4;
        display: flex; gap: 10px; align-items: center; justify-content: center;
        padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
        background: linear-gradient(180deg, rgba(6,10,24,0), rgba(6,10,24,.85) 35%, #060a18 75%);
      }

      /* A short instruction line above each picker row — the cards alone
         (especially the un-headed condition row) read as a features list,
         not something to interact with. */
      .section-label { margin-top: 20px; font-size: 13px; font-weight: 800; letter-spacing: .5px; color: #ffd23f; text-transform: uppercase; }
      .section-label .hint { color: #8fa0c9; font-weight: 600; text-transform: none; letter-spacing: 0; }

      .grid-preview { display: flex; gap: 8px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
      .slot { width: 42px; height: 30px; border-radius: 6px; background: #1c2338; border: 2px solid #3a4568; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #66708f; }
      .slot.human.joined { border-color: #fff; color: #08130a; box-shadow: 0 0 10px rgba(255,255,255,.5); }

      .track-select { display: flex; gap: 10px; justify-content: center; margin-top: 18px; flex-wrap: wrap; }
      .track-card {
        width: 148px; padding: 10px 12px; border-radius: 10px;
        background: #141a2e; border: 2px solid #3a4568; cursor: pointer;
        text-align: left; transition: border-color .15s, background .15s;
      }
      .track-card:hover { border-color: #5689e8; }
      .track-card:focus-visible, button:focus-visible { outline: 3px solid #7fe8ff; outline-offset: 2px; }
      .track-card.selected { border-color: #ffd23f; background: #1e2540; box-shadow: 0 0 12px rgba(255,210,63,.35); }
      .track-card .name { font-family: "Bangers", cursive; font-size: 18px; letter-spacing: 1px; color: #fff; }
      .track-card .desc { font-size: 11px; color: #8fa0c9; margin-top: 4px; line-height: 1.4; }
      .track-card .thumb { width: 100%; height: 40px; margin-top: 6px; }

      canvas { display: none; position: fixed; inset: 0; width: 100vw; height: 100vh; background: #78c7ff; }

      #topBar { display: none; position: fixed; top: 0; left: 0; right: 0; justify-content: center; gap: 8px; padding: 8px; z-index: 3; pointer-events: none; }
      #topBar span { padding: 6px 16px; border-radius: 999px; background: rgba(10,10,20,.6); border: 1px solid rgba(255,255,255,.2); font-weight: 800; letter-spacing: 1px; font-size: 13px; }
      #timerDisplay { display: none; font-variant-numeric: tabular-nums; }
      #timerDisplay.urgent { color: #ff4a4a; border-color: rgba(255,74,74,.6); animation: timerPulse .6s infinite alternate; }
      @keyframes timerPulse { from { opacity: 1; } to { opacity: .5; } }

      #countdownOverlay { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; z-index: 6; pointer-events: none; }
      #countdownNum { font-family: "Bangers", cursive; font-size: 160px; text-shadow: 0 0 30px rgba(0,0,0,.6), 0 0 60px currentColor; animation: pop .35s ease; }
      .c-three, .c-two { color: #ff4a4a; }
      .c-one { color: #ffd23f; }
      .c-go { color: #4dff6a; }
      @keyframes pop { from { transform: scale(0.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

      #pauseOverlay { display: none; position: fixed; inset: 0; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: rgba(0,0,0,.5); z-index: 5; }
      #pauseOverlay h2 { font-family: "Bangers", cursive; font-size: 54px; letter-spacing: 6px; color: #ffd23f; }
      .actions { display: flex; gap: 10px; align-items: center; justify-content: center; }

      /* One picker row visible at a time instead of all three stacked, so
         picking track/conditions/difficulty no longer means scrolling past
         the others first — Back/Next (below) step through them in place. */
      #stepNav { margin-top: 20px; }
      #stepLabel { color: #8fa0c9; font-weight: 700; font-size: 13px; min-width: 88px; }
      #stepBackBtn, #stepNextBtn { background: #1a2f66; color: #cfe1ff; border: 1px solid #5689e8; box-shadow: none; padding: 10px 22px; }
      #menuBtn { background: #1a2f66; color: #cfe1ff; border: 1px solid #5689e8; box-shadow: none; }
      #quitBtn { background: #4a1a1a; color: #ffd6d6; border: 1px solid #a04040; }

      #podiumOverlay { display: none; position: fixed; inset: 0; background: rgba(4,6,16,.92); align-items: center; justify-content: center; flex-direction: column; gap: 14px; z-index: 7; }
      #podiumTitle { font-family: "Bangers", cursive; font-size: 44px; color: #ffd23f; text-shadow: 0 0 16px rgba(255,178,0,.6); }
      #podiumList { width: min(92vw, 460px); display: flex; flex-direction: column; gap: 6px; max-height: 60vh; overflow-y: auto; }
      .podium-row { display: grid; grid-template-columns: 46px 22px 1fr 70px; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 8px; background: rgba(255,255,255,.06); }
      .podium-row.me { background: rgba(255,210,63,.18); border: 1px solid rgba(255,210,63,.5); }
      .podium-row .pos { font-family: "Bangers", cursive; font-size: 20px; color: #cfe1ff; }
      .podium-row .swatch { width: 16px; height: 16px; border-radius: 50%; }
      .podium-row .time { text-align: right; font-variant-numeric: tabular-nums; color: #9fb0d8; }
    </style>
  </head>
  <body>
    <div id="lobby">
      <h1>NITRO RACING</h1>
      <p>Scan with your phone to become a driver — or plug in a gamepad</p>
      <div id="roomCode">----</div>
      <div id="qrcode"></div>
      <div id="players">Waiting for driver...</div>
      <div id="gridPreview" class="grid-preview"></div>

      <div id="lobbySteps">
        <div class="lobby-step" data-step="0">
          <div class="section-label">1. Pick a track <span class="hint">— tap a card to choose</span></div>
          <div id="trackSelect" class="track-select"></div>
        </div>
        <div class="lobby-step" data-step="1" hidden>
          <div class="section-label">2. Race conditions <span class="hint">— tap a card to choose</span></div>
          <div id="conditionSelect" class="track-select"></div>
        </div>
        <div class="lobby-step" data-step="2" hidden>
          <div class="section-label">3. Difficulty <span class="hint">— tap a card to choose</span></div>
          <div id="difficultySelect" class="track-select"></div>
        </div>
      </div>

      <div id="stepNav" class="actions">
        <button id="stepBackBtn" disabled>Back</button>
        <span id="stepLabel">Step 1 of 3</span>
        <button id="stepNextBtn">Next</button>
      </div>
    </div>

    <div id="playBar">
      <button id="twoBtn" disabled>Two Players</button>
      <button id="aiBtn" disabled>Play vs CPU</button>
      <button id="timerBtn" disabled>Time Attack</button>
      <button id="fullscreenBtn">Enter Fullscreen</button>
    </div>

    <div id="topBar"><span id="topBarLabel">RACE</span><span id="timerDisplay">3:00</span></div>
    <canvas id="game" width="1280" height="720"></canvas>
    <div id="countdownOverlay"><div id="countdownNum" class="display-font">3</div></div>
    <div id="pauseOverlay">
      <h2>PAUSED</h2>
      <div class="actions">
        <button id="resumeBtn">Resume</button>
        <button id="quitBtn">Quit to Menu</button>
      </div>
    </div>
    <div id="podiumOverlay">
      <div id="podiumTitle">FINISH</div>
      <div id="podiumList"></div>
      <div class="actions">
        <button id="restartBtn">Play Again</button>
        <button id="menuBtn">Back to Menu</button>
      </div>
    </div>

    <script src="js/track.js"></script>
    <script src="js/render.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/kart-sprite.js"></script>
    <script>
      const wsProtocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      const ws = new WebSocket(`${wsProtocol}//${location.host}`);
      const gameParams = new URLSearchParams(location.search);
      const requestedId = (gameParams.get('id') || localStorage.getItem('racingGameId') || '').toUpperCase();
      let gameId = /^[A-Z2-9]{4}$/.test(requestedId) ? requestedId : null;
      let mode = 'two';
      let connectedPlayers = new Set();

      const canvas = document.getElementById('game');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;

      const TOTAL_KARTS = 8;
      const TARGET_LAPS = 3;
      const MAX_SPEED = 12000;
      const ACCEL = MAX_SPEED / 5;
      const BRAKE_DECEL = MAX_SPEED;
      const ENGINE_DECEL = MAX_SPEED / 5;
      const OFFROAD_MAX_SPEED = MAX_SPEED / 4;
      const CENTRIFUGAL = 0.2; // was 0.3 — eased so holding a drift line fights the player less
      const BOOST_MULTIPLIER = 1.35;
      const COLLISION_X = 0.24; // lateral radius (road units) at which two karts start touching
      const COLLISION_Z = 260;  // longitudinal radius (world units) — a minimum following gap
      const ITEM_CAP = 6;
      const ITEM_KINDS = ['boost', 'bomb', 'side', 'swap', 'slow', 'shield', 'banana', 'missile', 'star'];
      const ITEM_COLORS = { boost: '#ffd23f', bomb: '#ff5a5a', side: '#ff8a3d', swap: '#c77dff', slow: '#4dd2ff', shield: '#4dff9e', banana: '#d9b429', missile: '#5271ff', star: '#ffe97a' };
      // Font Awesome 6 Free Solid glyphs: bolt, bomb, hand-fist, right-left,
      // snowflake, shield-halved, triangle-exclamation, rocket, star. Every
      // ITEM_KINDS entry needs one here — banana and star both shipped
      // without one at first and fell back to an undecorated dot in the
      // held-item HUD row (drawItemIcon below), which read as "nothing
      // happened" on pickup. Missile got the same fix preemptively.
      const ITEM_ICON_GLYPHS = { boost: '', bomb: '', side: '', swap: '', slow: '', shield: '', banana: '', missile: '', star: '' };
      let faReady = false;
      if (document.fonts && document.fonts.load) {
        document.fonts.load('900 32px "Font Awesome 6 Free"').then(() => { faReady = true; }).catch(() => {});
      }
      const PALETTE = ['#4dff4d', '#ff5a5a', '#4dd2ff', '#ffcc33', '#c77dff', '#ff8a3d', '#7dffb0', '#ff5ac8'];
      KartSprite.init('assets/car.jpeg', PALETTE);

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

      // Race conditions — orthogonal to which track layout is picked.
      // gripMultiplier scales CENTRIFUGAL (higher = more corner slide, i.e.
      // less grip); speedMultiplier scales the car's effective top speed;
      // night/fogStart/visibleDistance feed straight into
      // Render.renderScene — visibleDistance (fraction of the normal draw
      // distance) is what actually shortens what gets drawn/culled; moving
      // fogStart alone barely registered since distant segments are already
      // tiny from perspective (see render.js's renderScene comment).
      // Fog is deliberately paired with night rather than sold separately —
      // blended against a bright clear-day sky it read as a weird pale haze
      // rather than fog; blended against night's already-dark palette,
      // things convincingly vanish into the dark a short way ahead.
      const CONDITIONS = {
        clear: { name: 'Clear Day', desc: 'Standard conditions — full grip, full visibility.', night: false, rain: false, fogStart: null, visibleDistance: 1, gripMultiplier: 1, speedMultiplier: 1 },
        rain: { name: 'Rain', desc: 'Slick road — corners push you noticeably wider, top speed is down.', night: false, rain: true, fogStart: null, visibleDistance: 1, gripMultiplier: 2.0, speedMultiplier: 0.88 },
        fog: { name: 'Foggy Night', desc: 'Dense fog after dark — you can only see a short way ahead.', night: true, rain: false, fogStart: 0, visibleDistance: 0.07, gripMultiplier: 1, speedMultiplier: 1 },
        night: { name: 'Night', desc: 'Dark and clear — track lit only by lampposts, full visibility.', night: true, rain: false, fogStart: null, visibleDistance: 1, gripMultiplier: 1, speedMultiplier: 1 },
      };
      const CONDITION_LIST = Object.keys(CONDITIONS).map((id) => ({ id, name: CONDITIONS[id].name, desc: CONDITIONS[id].desc }));
      const DEFAULT_CONDITION = 'clear';
      const storedConditionId = localStorage.getItem('racingConditionId');
      let selectedConditionId = CONDITIONS[storedConditionId] ? storedConditionId : DEFAULT_CONDITION;
      let activeConditions = CONDITIONS[DEFAULT_CONDITION];

      // How hard the AI grid races, independent of track/conditions.
      // aiSpeedMultiplier scales the AI's baseline top speed before the
      // rubberband adjustment below is applied. rubberbandEase caps how much
      // a bot can slow down once it's ahead of the nearest human;
      // rubberbandCatchup caps how much it can speed up once it's behind —
      // these are deliberately separate, not one shared band: a single
      // symmetric band at 0 for Insane (the original approach) killed catch
      // up along with ease-off, so a bot that fell behind once — a bad
      // corner, a hazard, anything — could never close the gap again and
      // the run was decided. Insane now sets ease to 0 (never gives back a
      // lead) while catchup stays high (relentless once behind). wander is
      // the amplitude of the bots' per-car steering wobble (see ai.js) —
      // lower means a tighter, more precise racing line. brakeThreshold is
      // how sharp a corner has to be before a bot brakes for it at all —
      // and it matters far more than aiSpeedMultiplier in practice, because
      // BRAKE_DECEL is 5x ACCEL: every unnecessary brake event costs several
      // seconds of recovery back to cruising speed, which swamps a higher
      // top-speed cap the bot then barely gets to use. A prior version of
      // this pulled the threshold *down* for Hard/Insane on the theory that
      // it reduced crash risk — backwards, since a lower threshold flags
      // more corners as "sharp" and triggers braking more often. Hard/Insane
      // now push it way up instead, so bots rely on grip and steering
      // through ordinary corners and only brake for genuinely extreme ones.
      const DIFFICULTIES = {
        easy: { name: 'Easy', desc: 'Sharper lines, quicker items — closing a gap takes real pace.', aiSpeedMultiplier: 1.06, rubberbandEase: 0.08, rubberbandCatchup: 0.08, boostChance: 0.05, itemChanceMultiplier: 1.3, wander: 0.1, brakeThreshold: 26 },
        normal: { name: 'Normal', desc: 'Fast and aggressive — expect a real fight to the line.', aiSpeedMultiplier: 1.12, rubberbandEase: 0.04, rubberbandCatchup: 0.1, boostChance: 0.08, itemChanceMultiplier: 1.6, wander: 0.04, brakeThreshold: 30 },
        hard: { name: 'Hard', desc: 'Genuinely fast, and it claws back any gap you open up.', aiSpeedMultiplier: 1.28, rubberbandEase: 0.02, rubberbandCatchup: 0.2, boostChance: 0.14, itemChanceMultiplier: 2.2, wander: 0.01, brakeThreshold: 55 },
        insane: { name: 'Insane', desc: 'Faster than your top speed even without boosting, and a lead never lasts — it will run you down.', aiSpeedMultiplier: 1.45, rubberbandEase: 0, rubberbandCatchup: 0.32, boostChance: 0.2, itemChanceMultiplier: 3.0, wander: 0, brakeThreshold: 90 },
      };
      const DIFFICULTY_LIST = Object.keys(DIFFICULTIES).map((id) => ({ id, name: DIFFICULTIES[id].name, desc: DIFFICULTIES[id].desc }));
      const DEFAULT_DIFFICULTY = 'normal';
      const storedDifficultyId = localStorage.getItem('racingDifficultyId');
      let selectedDifficultyId = DIFFICULTIES[storedDifficultyId] ? storedDifficultyId : DEFAULT_DIFFICULTY;
      let activeDifficulty = DIFFICULTIES[DEFAULT_DIFFICULTY];

      const storedTrackId = localStorage.getItem('racingTrackId');
      let selectedTrackId = Track.LIST.some((t) => t.id === storedTrackId) ? storedTrackId : Track.DEFAULT_ID;
      let track = Track.buildTrack(selectedTrackId);
      let cars = [];
      let itemBoxes = [];
      let projectiles = [];
      let phase = 'lobby'; // lobby -> countdown -> racing -> finished
      let paused = false;
      const LOBBY_STEP_COUNT = document.querySelectorAll('.lobby-step').length;
      let lobbyStep = 0;
      let humanCount = 1;
      let raceStartedAt = 0;
      let countdownStartedAt = 0;
      let lastFrame = 0;
      // Tracks the live requestAnimationFrame chain so a restart (Play
      // Again, or now Quit-then-play-again) can cancel the old one before
      // starting a new — without this, every startGame() call left its
      // previous frameTick chain running forever (it reschedules itself
      // unconditionally), so N game starts meant N concurrent loops each
      // doing a full tick/draw pass per real frame. Confirmed by counting
      // actual rAF firings before/after a restart: ~2x after just one
      // restart, compounding with every subsequent one.
      let rafId = null;
      // Time Attack: opponents are still on track (traffic/hazards), but the
      // human's win condition is personal — finish all laps before this
      // clock runs out, regardless of where AI opponents place. Pace
      // constant calibrated by fast-forward-simulating a full AI race
      // (tickRace called directly with a synthetic clock, bypassing real
      // wall-clock wait) and measuring actual finish times across three
      // track lengths: ~0.28ms of race time per world-unit of one lap's
      // length was consistent across a straight-heavy oval, a technical
      // circuit, and a hairpin-heavy track. The buffer on top of that AI
      // baseline is what makes it a fair "drive well" challenge rather than
      // requiring a flawless run.
      const TIME_ATTACK_PACE_MS_PER_UNIT = 0.28;
      const TIME_ATTACK_BUFFER = 1.25;
      let timerModeActive = false;
      let raceTimeLimitMs = 0;

      const controls = { 1: { left: false, right: false, up: false, down: false }, 2: { left: false, right: false, up: false, down: false } };

      // Gamepad API support — a controller plugged into (or paired with)
      // this machine drives the same `controls[playerNum]` state a phone
      // controller's WebSocket messages do, so tickRace/updateCarPhysics
      // don't need to know which input source is in play. A gamepad claims
      // whichever human slot (1 or 2) isn't already held by a connected
      // phone, so the two sources can't fight over the same car; it also
      // adds itself to `connectedPlayers` so the lobby's player count and
      // Play-button gating see it exactly like a phone joining.
      const gamepadSlots = {}; // gamepad.index -> playerNum
      const gamepadPrevButtons = {}; // gamepad.index -> {start, boost, useItem, item} from last poll, for edge detection
      const GAMEPAD_DEADZONE = 0.25;

      function assignGamepadSlot(gp) {
        if (gamepadSlots[gp.index] != null) return gamepadSlots[gp.index];
        for (const n of [1, 2]) {
          if (!connectedPlayers.has(n)) {
            gamepadSlots[gp.index] = n;
            connectedPlayers.add(n);
            syncLobby();
            return n;
          }
        }
        return null;
      }
      window.addEventListener('gamepadconnected', (e) => assignGamepadSlot(e.gamepad));
      window.addEventListener('gamepaddisconnected', (e) => {
        const n = gamepadSlots[e.gamepad.index];
        if (n == null) return;
        connectedPlayers.delete(n);
        delete gamepadSlots[e.gamepad.index];
        delete gamepadPrevButtons[e.gamepad.index];
        syncLobby();
      });

      // Buttons/axes follow the standard Gamepad API mapping (Xbox/PS/most
      // generic pads report this): D-pad or the left stick steers, A or
      // either trigger accelerates, B or B/L2 brakes, and the three other
      // face buttons mirror the phone controller's ○/□/△ layout (boost /
      // use item / cycle item). Called every frame regardless of phase —
      // there's no "button held" event, only a snapshot to poll — and it's
      // a harmless no-op outside racing since tryBoost/tryUseItem/etc.
      // already guard on phase themselves.
      function pollGamepads() {
        const pads = navigator.getGamepads ? navigator.getGamepads() : [];
        for (const gp of pads) {
          if (!gp) continue;
          const playerNum = gamepadSlots[gp.index] ?? assignGamepadSlot(gp);
          if (playerNum == null) continue;
          const c = controls[playerNum];
          if (!c) continue;

          const axisX = gp.axes[0] || 0;
          const dpadLeft = !!gp.buttons[14]?.pressed, dpadRight = !!gp.buttons[15]?.pressed;
          const dpadUp = !!gp.buttons[12]?.pressed, dpadDown = !!gp.buttons[13]?.pressed;
          // Face-button indices only hold the W3C bottom/right/left/top
          // order (0/1/2/3) when the browser recognizes the pad and reports
          // gp.mapping === 'standard'. Many PS-layout controllers (DualShock
          // clones, etc.) aren't in the browser's curated device DB and fall
          // back to their raw HID report order instead, which for that
          // common case comes through as [Triangle, Circle, X, Square] —
          // confirmed against a real device where accelerate/use-item/cycle
          // fired off Triangle/X/Square respectively while boost (Circle,
          // index 1 either way) happened to still work.
          const standardFace = gp.mapping === 'standard';
          const faceIdx = standardFace ? { accel: 0, boost: 1, useItem: 2, item: 3 } : { accel: 2, boost: 1, useItem: 3, item: 0 };
          const btnA = !!gp.buttons[faceIdx.accel]?.pressed;
          const rt = !!gp.buttons[7]?.pressed || (gp.buttons[7]?.value ?? 0) > 0.4;
          const lt = !!gp.buttons[6]?.pressed || (gp.buttons[6]?.value ?? 0) > 0.4;
          const boost = !!gp.buttons[faceIdx.boost]?.pressed;
          const useItem = !!gp.buttons[faceIdx.useItem]?.pressed;
          const item = !!gp.buttons[faceIdx.item]?.pressed;
          const start = !!gp.buttons[9]?.pressed;

          c.left = dpadLeft || axisX < -GAMEPAD_DEADZONE;
          c.right = dpadRight || axisX > GAMEPAD_DEADZONE;
          c.up = dpadUp || btnA || rt;
          c.down = dpadDown || lt;

          const prev = gamepadPrevButtons[gp.index] || {};
          const car = getCarByPlayerNum(playerNum);
          if (start && !prev.start) togglePause();
          if (boost && !prev.boost && car) tryBoost(car);
          if (useItem && !prev.useItem && car) tryUseItem(car);
          if (item && !prev.item && car) cycleSelectedItem(car);
          gamepadPrevButtons[gp.index] = { start, boost, useItem, item };
        }
      }

      function roundRectPath(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.arcTo(x + w, y, x + w, y + h, r);
        c.arcTo(x + w, y + h, x, y + h, r);
        c.arcTo(x, y + h, x, y, r);
        c.arcTo(x, y, x + w, y, r);
        c.closePath();
      }

      function shadeColor(hex, percent) {
        const n = parseInt(hex.slice(1), 16);
        const r = clamp(((n >> 16) & 255) + percent, 0, 255);
        const g = clamp(((n >> 8) & 255) + percent, 0, 255);
        const b = clamp((n & 255) + percent, 0, 255);
        return `rgb(${r | 0},${g | 0},${b | 0})`;
      }

      // A single flickering nitro flame shooting out of one exhaust pipe —
      // layered outer plume (color gradient) + a brighter, shorter inner
      // core, both tapering to a point and jittering per-frame so twin
      // flames don't pulse in lockstep (`x`'s sign decorrelates the phase).
      // `hot` switches the outer plume to a blue "overcharged" palette —
      // used when a second boost lands while one is already running, the
      // same stacked-boost cue as a Mario Kart-style blue flame.
      function drawNitroFlame(c, s, x, hot) {
        const t = performance.now();
        const flicker = 0.82 + 0.18 * Math.sin(t * 0.045 + x * 0.37);
        const jitter = Math.sin(t * 0.09 + x * 0.13) * s * 0.045;
        const len = s * (0.5 + 0.3 * flicker);
        const baseW = s * 0.15;
        c.save();
        c.translate(x, 0);

        const outer = c.createLinearGradient(0, 0, 0, len);
        if (hot) {
          outer.addColorStop(0, 'rgba(210,235,255,.95)');
          outer.addColorStop(0.3, 'rgba(110,180,255,.85)');
          outer.addColorStop(0.68, 'rgba(50,110,255,.5)');
          outer.addColorStop(1, 'rgba(30,70,255,0)');
        } else {
          outer.addColorStop(0, 'rgba(255,235,180,.95)');
          outer.addColorStop(0.3, 'rgba(255,160,50,.85)');
          outer.addColorStop(0.68, 'rgba(255,80,20,.5)');
          outer.addColorStop(1, 'rgba(255,40,10,0)');
        }
        c.fillStyle = outer;
        c.beginPath();
        c.moveTo(-baseW, 0);
        c.quadraticCurveTo(-baseW * 0.55 + jitter, len * 0.55, 0, len);
        c.quadraticCurveTo(baseW * 0.55 + jitter, len * 0.55, baseW, 0);
        c.closePath();
        c.fill();

        const coreLen = len * 0.58;
        const coreW = baseW * 0.42;
        const core = c.createLinearGradient(0, 0, 0, coreLen);
        core.addColorStop(0, 'rgba(255,255,255,.95)');
        core.addColorStop(1, hot ? 'rgba(160,210,255,0)' : 'rgba(255,220,120,0)');
        c.fillStyle = core;
        c.beginPath();
        c.moveTo(-coreW, 0);
        c.quadraticCurveTo(-coreW * 0.4 + jitter * 0.5, coreLen * 0.5, 0, coreLen);
        c.quadraticCurveTo(coreW * 0.4 + jitter * 0.5, coreLen * 0.5, coreW, 0);
        c.closePath();
        c.fill();
        c.restore();
      }

      // 0 grounded .. 1 apex — a parabolic arc over a jump ramp's airTimer
      // (which counts *down* from 1 at launch to 0 at landing), used to lift
      // the kart body and shrink/fade its shadow so a jump actually reads
      // as height rather than just "hazards can't touch you right now".
      function jumpHeightFactor(car) {
        return car.airTimer > 0 ? Math.sin((1 - car.airTimer) * Math.PI) : 0;
      }

      // Rear 3/4 view of a low, wide car — the angle you see other racers
      // from in a chase-cam kart racer. `s` is the body half-width unit.
      function drawKartShape(c, s, car) {
        const w = s;
        const bodyH = s * 0.62;
        const jumpT = jumpHeightFactor(car);

        c.fillStyle = `rgba(0,0,0,${0.4 * (1 - jumpT * 0.6)})`;
        c.beginPath(); c.ellipse(0, s * 0.08, w * 0.98 * (1 - jumpT * 0.4), s * 0.15 * (1 - jumpT * 0.4), 0, 0, Math.PI * 2); c.fill();
        c.save();
        c.translate(0, -jumpT * s * 0.55);

        // Rear tires peeking past the body on each side.
        c.fillStyle = '#161616';
        c.fillRect(-w * 1.08, -bodyH * 0.32, w * 0.24, bodyH * 0.58);
        c.fillRect(w * 0.84, -bodyH * 0.32, w * 0.24, bodyH * 0.58);

        // Lower body / rear fascia — wide and low, not a tall box.
        const grad = c.createLinearGradient(0, -bodyH * 1.05, 0, s * 0.05);
        grad.addColorStop(0, shadeColor(car.color, 45));
        grad.addColorStop(0.55, car.color);
        grad.addColorStop(1, shadeColor(car.color, -40));
        c.fillStyle = grad;
        roundRectPath(c, -w, -bodyH * 0.58, w * 2, bodyH * 0.6, s * 0.16);
        c.fill();

        // Bumper accent strip.
        c.fillStyle = shadeColor(car.color, -50);
        roundRectPath(c, -w * 0.96, -bodyH * 0.16, w * 1.92, bodyH * 0.18, s * 0.05);
        c.fill();

        // Greenhouse / rear windshield, narrower and set back on the roofline.
        c.fillStyle = '#12161f';
        roundRectPath(c, -w * 0.6, -bodyH * 1.18, w * 1.2, bodyH * 0.66, s * 0.12);
        c.fill();
        c.fillStyle = 'rgba(150,215,255,.55)';
        roundRectPath(c, -w * 0.48, -bodyH * 1.08, w * 0.96, bodyH * 0.4, s * 0.08);
        c.fill();

        // Spoiler.
        c.fillStyle = shadeColor(car.color, -20);
        c.fillRect(-w * 0.74, -bodyH * 1.3, w * 1.48, s * 0.08);
        c.fillRect(-w * 0.74, -bodyH * 1.3, s * 0.06, bodyH * 0.3);
        c.fillRect(w * 0.68, -bodyH * 1.3, s * 0.06, bodyH * 0.3);

        // Tail lights.
        c.fillStyle = 'rgba(255,45,45,.92)';
        roundRectPath(c, -w * 0.9, -bodyH * 0.48, w * 0.24, bodyH * 0.15, s * 0.03);
        c.fill();
        roundRectPath(c, w * 0.66, -bodyH * 0.48, w * 0.24, bodyH * 0.15, s * 0.03);
        c.fill();

        if (car.boosting) {
          c.save();
          c.translate(0, bodyH * 0.05);
          const hot = car.superBoostTimer > 0;
          drawNitroFlame(c, s, -w * 0.45, hot);
          drawNitroFlame(c, s, w * 0.45, hot);
          c.restore();
        }
        c.restore(); // matches the jump-lift translate above
      }

      // Real photo asset, chroma-keyed + recolored per kart (see kart-sprite.js).
      // Falls back to the drawn shape above until it finishes loading.
      function drawKartSpriteImage(c, s, car, sprite) {
        const jumpT = jumpHeightFactor(car);
        c.fillStyle = `rgba(0,0,0,${0.4 * (1 - jumpT * 0.6)})`;
        c.beginPath(); c.ellipse(0, s * 0.08, s * 0.98 * (1 - jumpT * 0.4), s * 0.15 * (1 - jumpT * 0.4), 0, 0, Math.PI * 2); c.fill();
        c.save();
        c.translate(0, -jumpT * s * 0.55);
        const w = s * 2.15;
        const h = w / sprite.aspect;
        c.drawImage(sprite.canvas, -w / 2, -h * 0.94, w, h);
        if (car.boosting) {
          c.save();
          c.translate(0, s * 0.05);
          const hot = car.superBoostTimer > 0;
          drawNitroFlame(c, s, -s * 0.22, hot);
          drawNitroFlame(c, s, s * 0.22, hot);
          c.restore();
        }
        c.restore(); // matches the jump-lift translate above
      }

      // While in a hole: sink-then-pop over the 3s stun (fast sink, held
      // small in the middle, fast pop back out at the end) instead of the
      // normal kart draw.
      function drawHoleAnimation(c, s, car) {
        const t = clamp(1 - car.holeTimer / 3, 0, 1);
        let scale, alpha;
        if (t < 0.2) { const k = t / 0.2; scale = 1 - k * 0.75; alpha = 1 - k * 0.5; }
        else if (t < 0.8) { scale = 0.25; alpha = 0.5; }
        else { const k = (t - 0.8) / 0.2; scale = 0.25 + k * 0.75; alpha = 0.5 + k * 0.5; }
        c.save();
        c.globalAlpha = 0.3 * (1 - Math.abs(t - 0.5) * 1.2);
        c.strokeStyle = '#8a7358';
        c.lineWidth = s * 0.06;
        c.beginPath(); c.ellipse(0, s * 0.1, s * 0.85, s * 0.22, 0, 0, Math.PI * 2); c.stroke();
        c.restore();
        c.save();
        c.globalAlpha = alpha;
        c.scale(scale, scale);
        c.rotate(Math.sin(performance.now() * 0.02) * 0.3 * (1 - Math.abs(t - 0.5) * 2));
        const sprite = KartSprite.get(car.color);
        if (sprite) drawKartSpriteImage(c, s, car, sprite);
        else drawKartShape(c, s, car);
        c.restore();
      }

      function drawItemIcon(c, x, y, r, kind, selected) {
        c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2);
        c.fillStyle = 'rgba(8,8,16,.6)';
        c.fill();
        c.strokeStyle = ITEM_COLORS[kind] || '#fff';
        c.lineWidth = Math.max(1, r * (selected ? 0.28 : 0.16));
        c.stroke();
        if (selected) {
          c.beginPath(); c.arc(x, y, r * 1.32, 0, Math.PI * 2);
          c.strokeStyle = 'rgba(255,255,255,.85)';
          c.lineWidth = Math.max(1, r * 0.1);
          c.stroke();
        }
        const glyph = ITEM_ICON_GLYPHS[kind];
        if (faReady && glyph) {
          c.fillStyle = ITEM_COLORS[kind] || '#fff';
          c.font = `900 ${r * 1.4}px "Font Awesome 6 Free"`;
          c.textAlign = 'center';
          c.textBaseline = 'middle';
          c.fillText(glyph, x, y + r * 0.05);
        } else {
          c.fillStyle = ITEM_COLORS[kind] || '#fff';
          c.beginPath(); c.arc(x, y, r * 0.48, 0, Math.PI * 2); c.fill();
        }
      }

      function drawItemRow(c, s, car) {
        if (!car.items.length) return;
        const r = s * 0.12;
        const gap = r * 2.6;
        const startX = -((car.items.length - 1) * gap) / 2;
        const y = -s * 1.55;
        car.items.forEach((kind, i) => drawItemIcon(c, startX + i * gap, y, r, kind, i === car.selectedIndex));
      }

      function drawShieldBubble(c, s, car) {
        const pulse = 0.75 + 0.25 * Math.sin(performance.now() * 0.006);
        const fadeOut = car.shieldTimer < 1.5 ? car.shieldTimer / 1.5 : 1; // flicker out in the last 1.5s
        c.save();
        c.globalAlpha = 0.28 * pulse * fadeOut;
        c.fillStyle = ITEM_COLORS.shield;
        c.beginPath(); c.ellipse(0, -s * 0.55, s * 1.15, s * 1.35, 0, 0, Math.PI * 2); c.fill();
        c.globalAlpha = 0.65 * pulse * fadeOut;
        c.strokeStyle = ITEM_COLORS.shield;
        c.lineWidth = Math.max(1, s * 0.05);
        c.beginPath(); c.ellipse(0, -s * 0.55, s * 1.15, s * 1.35, 0, 0, Math.PI * 2); c.stroke();
        c.restore();
      }

      // Star: a rotating ring of colored sparkles plus a soft golden glow —
      // deliberately busier/brighter than the shield bubble so "invincible
      // and dangerous to touch" reads differently from "just blocking hits".
      function drawStarAura(c, s, car) {
        const t = performance.now();
        const fadeOut = car.starTimer < 1.0 ? car.starTimer / 1.0 : 1; // flicker out in the last 1s
        c.save();
        c.globalAlpha = 0.5 * fadeOut;
        const glow = c.createRadialGradient(0, -s * 0.5, 0, 0, -s * 0.5, s * 1.3);
        glow.addColorStop(0, 'rgba(255,235,150,.6)');
        glow.addColorStop(1, 'rgba(255,235,150,0)');
        c.fillStyle = glow;
        c.beginPath(); c.arc(0, -s * 0.5, s * 1.3, 0, Math.PI * 2); c.fill();
        c.restore();

        const sparkColors = ['#ff5a5a', '#ffd23f', '#4dff9e', '#4dd2ff', '#c77dff'];
        const n = sparkColors.length;
        for (let i = 0; i < n; i++) {
          const ang = t * 0.003 + (i / n) * Math.PI * 2;
          const r = s * 1.05;
          const px = Math.cos(ang) * r;
          const py = -s * 0.55 + Math.sin(ang) * r * 0.35;
          const sz = s * 0.09;
          c.save();
          c.globalAlpha = fadeOut;
          c.fillStyle = sparkColors[i];
          c.beginPath();
          c.moveTo(px, py - sz); c.lineTo(px + sz * 0.3, py - sz * 0.3);
          c.lineTo(px + sz, py); c.lineTo(px + sz * 0.3, py + sz * 0.3);
          c.lineTo(px, py + sz); c.lineTo(px - sz * 0.3, py + sz * 0.3);
          c.lineTo(px - sz, py); c.lineTo(px - sz * 0.3, py - sz * 0.3);
          c.closePath();
          c.fill();
          c.restore();
        }
      }

      function drawNameLabel(c, s, car) {
        if (s < 14) return; // too small/far to read
        c.save();
        c.font = `700 ${Math.max(9, s * 0.24)}px "Baloo 2", Arial`;
        c.textAlign = 'center';
        c.textBaseline = 'alphabetic';
        const y = -s * (car.items.length ? 2.05 : 1.7);
        c.lineWidth = Math.max(1.5, s * 0.05);
        c.strokeStyle = 'rgba(0,0,0,.75)';
        c.strokeText(car.name, 0, y);
        c.fillStyle = '#fff';
        c.fillText(car.name, 0, y);
        c.restore();
      }

      function drawKart(c, s, car) {
        if (car.holeTimer > 0) { drawHoleAnimation(c, s, car); return; }
        const sprite = KartSprite.get(car.color);
        if (sprite) drawKartSpriteImage(c, s, car, sprite);
        else drawKartShape(c, s, car);
        if (car.shieldTimer > 0) drawShieldBubble(c, s, car);
        if (car.starTimer > 0) drawStarAura(c, s, car);
        drawItemRow(c, s, car);
        drawNameLabel(c, s, car);
      }

      function drawItemBoxShape(c, s) {
        const spin = Math.sin(performance.now() * 0.006);
        c.save();
        c.scale(0.6 + Math.abs(spin) * 0.4, 1);
        c.fillStyle = '#ffcc33';
        c.strokeStyle = '#8a5a00';
        c.lineWidth = Math.max(1, s * 0.06);
        roundRectPath(c, -s * 0.35, -s * 0.7, s * 0.7, s * 0.7, s * 0.1);
        c.fill(); c.stroke();
        c.fillStyle = '#8a5a00';
        c.font = `900 ${Math.max(6, s * 0.5)}px Arial`;
        c.textAlign = 'center';
        c.fillText('?', 0, -s * 0.22);
        c.restore();
      }

      function drawBombShape(c, s) {
        c.fillStyle = '#3a2a2a';
        c.beginPath(); c.arc(0, -s * 0.3, s * 0.4, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,.35)';
        c.beginPath(); c.arc(-s * 0.12, -s * 0.42, s * 0.12, 0, Math.PI * 2); c.fill();
        c.strokeStyle = '#ff5a3a';
        c.lineWidth = Math.max(1, s * 0.06);
        c.beginPath(); c.moveTo(0, -s * 0.7); c.lineTo(s * 0.1, -s * 0.85); c.stroke();
      }

      function drawSwapShape(c, s) {
        c.fillStyle = '#c77dff';
        c.beginPath(); c.arc(0, -s * 0.3, s * 0.38, 0, Math.PI * 2); c.fill();
        c.strokeStyle = 'rgba(255,255,255,.65)';
        c.lineWidth = Math.max(1, s * 0.05);
        c.beginPath(); c.arc(0, -s * 0.3, s * 0.22, 0.4, Math.PI * 1.6); c.stroke();
        c.beginPath(); c.arc(0, -s * 0.3, s * 0.22, Math.PI * 1.4, Math.PI * 2.6); c.stroke();
      }

      function drawSlowShape(c, s) {
        c.fillStyle = 'rgba(77,210,255,.8)';
        c.beginPath(); c.ellipse(0, -s * 0.28, s * 0.4, s * 0.32, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(255,255,255,.5)';
        c.beginPath(); c.ellipse(-s * 0.1, -s * 0.4, s * 0.1, s * 0.07, 0, 0, Math.PI * 2); c.fill();
      }

      // Ground decal, dropped in place — flattened like the grease patch
      // hazard below rather than a standing object.
      function drawBananaShape(c, s) {
        c.fillStyle = 'rgba(0,0,0,.25)';
        c.beginPath(); c.ellipse(0, s * 0.08, s * 0.55, s * 0.16, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#e8d34a';
        c.strokeStyle = '#8a6d1a';
        c.lineWidth = Math.max(1, s * 0.04);
        c.beginPath(); c.ellipse(-s * 0.22, 0, s * 0.42, s * 0.15, 0.5, 0, Math.PI * 2); c.fill(); c.stroke();
        c.beginPath(); c.ellipse(s * 0.22, 0, s * 0.42, s * 0.15, -0.5, 0, Math.PI * 2); c.fill(); c.stroke();
        c.fillStyle = '#5a4318';
        c.beginPath(); c.ellipse(0, 0, s * 0.08, s * 0.08, 0, 0, Math.PI * 2); c.fill();
      }

      // Blue-tinted rocket with fins and a fading exhaust trail — visually
      // distinct from the bomb/banana ground hazards since it's homing
      // through the air toward a specific kart, not sitting on the road.
      function drawMissileShape(c, s) {
        const pulse = 0.6 + 0.4 * Math.sin(performance.now() * 0.02);
        const trail = c.createLinearGradient(0, -s * 0.1, 0, s * 0.9);
        trail.addColorStop(0, 'rgba(140,190,255,.7)');
        trail.addColorStop(1, 'rgba(140,190,255,0)');
        c.fillStyle = trail;
        c.beginPath(); c.moveTo(-s * 0.12, -s * 0.1); c.lineTo(s * 0.12, -s * 0.1); c.lineTo(0, s * 0.9); c.closePath(); c.fill();

        c.fillStyle = '#dfe8ff';
        roundRectPath(c, -s * 0.16, -s * 0.75, s * 0.32, s * 0.6, s * 0.14);
        c.fill();
        c.fillStyle = '#3a5fe0';
        c.beginPath(); c.moveTo(-s * 0.16, -s * 0.75); c.lineTo(0, -s * 1.05); c.lineTo(s * 0.16, -s * 0.75); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(-s * 0.16, -s * 0.2); c.lineTo(-s * 0.34, -s * 0.02); c.lineTo(-s * 0.16, -s * 0.02); c.closePath(); c.fill();
        c.beginPath(); c.moveTo(s * 0.16, -s * 0.2); c.lineTo(s * 0.34, -s * 0.02); c.lineTo(s * 0.16, -s * 0.02); c.closePath(); c.fill();

        c.fillStyle = `rgba(150,200,255,${0.7 * pulse})`;
        c.beginPath(); c.arc(0, -s * 0.9, s * 0.14, 0, Math.PI * 2); c.fill();
      }

      function drawProjectileShape(c, s, kind) {
        if (kind === 'swap') drawSwapShape(c, s);
        else if (kind === 'slow') drawSlowShape(c, s);
        else if (kind === 'banana') drawBananaShape(c, s);
        else if (kind === 'missile') drawMissileShape(c, s);
        else drawBombShape(c, s);
      }

      // Flattened ground decals — very short vertical extent so they read
      // as lying on the road rather than standing objects.
      function drawGreasePatchShape(c, s) {
        c.fillStyle = 'rgba(40,35,25,.55)';
        c.beginPath(); c.ellipse(0, 0, s * 0.9, s * 0.22, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = 'rgba(90,78,55,.35)';
        c.beginPath(); c.ellipse(-s * 0.2, -s * 0.04, s * 0.35, s * 0.08, 0, 0, Math.PI * 2); c.fill();
      }

      function drawBoostPadShape(c, s) {
        const pulse = 0.6 + 0.4 * Math.sin(performance.now() * 0.008);
        c.fillStyle = `rgba(255,180,40,${0.35 * pulse})`;
        c.beginPath(); c.ellipse(0, 0, s * 0.85, s * 0.22, 0, 0, Math.PI * 2); c.fill();
        c.strokeStyle = `rgba(255,220,120,${0.8 * pulse})`;
        c.lineWidth = Math.max(1, s * 0.05);
        for (let i = -1; i <= 1; i++) {
          c.beginPath();
          c.moveTo(i * s * 0.3 - s * 0.15, s * 0.1);
          c.lineTo(i * s * 0.3, -s * 0.12);
          c.lineTo(i * s * 0.3 + s * 0.15, s * 0.1);
          c.stroke();
        }
      }

      // A wedge ramp face-on with speed-line chevrons, distinct from the
      // boost pad's flat glowing stripes — this one reads as a physical
      // incline, not a surface effect.
      function drawJumpRampShape(c, s) {
        c.fillStyle = 'rgba(0,0,0,.3)';
        c.beginPath(); c.ellipse(0, s * 0.14, s * 0.9, s * 0.2, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#d64545';
        roundRectPath(c, -s * 0.85, -s * 0.05, s * 1.7, s * 0.35, s * 0.06);
        c.fill();
        c.fillStyle = '#f0f0f0';
        for (let i = -2; i <= 2; i += 2) {
          c.beginPath();
          c.moveTo(i * s * 0.17 - s * 0.08, s * 0.3);
          c.lineTo(i * s * 0.17, -s * 0.02);
          c.lineTo(i * s * 0.17 + s * 0.08, s * 0.3);
          c.closePath();
          c.fill();
        }
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.01);
        c.strokeStyle = `rgba(255,220,140,${0.6 * pulse})`;
        c.lineWidth = Math.max(1, s * 0.045);
        for (const yOff of [-0.55, -0.75]) {
          c.beginPath();
          c.moveTo(-s * 0.3, yOff * s * 0.5); c.lineTo(0, yOff * s * 0.5 - s * 0.12); c.lineTo(s * 0.3, yOff * s * 0.5);
          c.stroke();
        }
      }

      // Dashed arrow decal marking a shortcut cut — points off-road, away
      // from `x`'s sign, so it visually matches whichever shoulder it's on.
      function drawShortcutArrowShape(c, s, x) {
        const dir = x > 0 ? 1 : -1;
        const pulse = 0.55 + 0.45 * Math.sin(performance.now() * 0.006);
        c.save();
        c.scale(dir, 1);
        c.strokeStyle = `rgba(120,255,170,${0.85 * pulse})`;
        c.fillStyle = `rgba(120,255,170,${0.85 * pulse})`;
        c.lineWidth = Math.max(1, s * 0.09);
        c.lineCap = 'round';
        for (const off of [0, 0.5, 1]) {
          c.beginPath();
          c.moveTo(-s * 0.7 + off * s * 0.6, s * 0.1);
          c.lineTo(-s * 0.15 + off * s * 0.6, -s * 0.05);
          c.stroke();
        }
        c.beginPath();
        c.moveTo(s * 0.55, -s * 0.05); c.lineTo(s * 0.22, -s * 0.28); c.lineTo(s * 0.22, s * 0.18);
        c.closePath();
        c.fill();
        c.restore();
      }

      function drawHoleShape(c, s) {
        const grad = c.createRadialGradient(0, 0, s * 0.05, 0, 0, s * 0.85);
        grad.addColorStop(0, 'rgba(5,5,8,.95)');
        grad.addColorStop(1, 'rgba(20,15,10,.15)');
        c.fillStyle = grad;
        c.beginPath(); c.ellipse(0, 0, s * 0.85, s * 0.24, 0, 0, Math.PI * 2); c.fill();
        c.strokeStyle = 'rgba(0,0,0,.6)';
        c.lineWidth = Math.max(1, s * 0.05);
        c.beginPath(); c.ellipse(0, 0, s * 0.85, s * 0.24, 0, 0, Math.PI * 2); c.stroke();
      }

      // Roadside dressing, drawn as static billboards alongside the hazards
      // above — trees, lampposts, and guardrail sections.
      function drawTreeShape(c, s) {
        c.fillStyle = 'rgba(0,0,0,.3)';
        c.beginPath(); c.ellipse(0, s * 0.05, s * 0.45, s * 0.11, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#6b4a2a';
        c.fillRect(-s * 0.07, -s * 0.85, s * 0.14, s * 0.9);
        const grad = c.createRadialGradient(-s * 0.15, -s * 1.5, s * 0.1, 0, -s * 1.35, s * 0.55);
        grad.addColorStop(0, '#5fbf5f');
        grad.addColorStop(1, '#2f7d3b');
        c.fillStyle = grad;
        c.beginPath(); c.arc(0, -s * 1.35, s * 0.55, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(-s * 0.28, -s * 1.12, s * 0.38, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(s * 0.28, -s * 1.12, s * 0.38, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.arc(0, -s * 1.75, s * 0.32, 0, Math.PI * 2); c.fill();
      }

      function drawLampShape(c, s) {
        c.fillStyle = 'rgba(0,0,0,.3)';
        c.beginPath(); c.ellipse(0, s * 0.05, s * 0.2, s * 0.06, 0, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#3a3f4a';
        c.fillRect(-s * 0.038, -s * 2.5, s * 0.076, s * 2.55);
        // Small horizontal arm the lamp head hangs from.
        c.fillRect(-s * 0.038, -s * 2.5, s * 0.28, s * 0.06);
        const glow = c.createRadialGradient(s * 0.24, -s * 2.55, 0, s * 0.24, -s * 2.55, s * 0.42);
        glow.addColorStop(0, 'rgba(255,220,140,.9)');
        glow.addColorStop(1, 'rgba(255,220,140,0)');
        c.fillStyle = glow;
        c.beginPath(); c.arc(s * 0.24, -s * 2.55, s * 0.42, 0, Math.PI * 2); c.fill();
        c.fillStyle = '#565c68';
        c.beginPath(); c.ellipse(s * 0.24, -s * 2.55, s * 0.14, s * 0.09, 0, 0, Math.PI * 2); c.fill();
      }

      function drawRailShape(c, s) {
        c.fillStyle = 'rgba(0,0,0,.25)';
        c.fillRect(-s * 0.9, s * 0.02, s * 1.8, s * 0.06);
        c.fillStyle = '#9aa3ad';
        for (let i = -2; i <= 2; i++) c.fillRect(i * s * 0.36 - s * 0.04, -s * 0.5, s * 0.08, s * 0.55);
        c.fillStyle = '#c7ccd2';
        c.fillRect(-s * 0.9, -s * 0.42, s * 1.8, s * 0.09);
        c.fillRect(-s * 0.9, -s * 0.18, s * 1.8, s * 0.07);
        c.fillStyle = 'rgba(255,255,255,.4)';
        c.fillRect(-s * 0.9, -s * 0.42, s * 1.8, s * 0.02);
      }

      function drawSceneryShape(c, s, kind) {
        if (kind === 'lamp') drawLampShape(c, s);
        else if (kind === 'rail') drawRailShape(c, s);
        else drawTreeShape(c, s);
      }

      function createCar(opts) {
        return {
          id: opts.id, name: opts.name, color: opts.color, playerNum: opts.playerNum, isAI: opts.isAI,
          x: opts.startX, totalDistance: opts.startZ,
          speed: 0, maxSpeed: MAX_SPEED,
          boostCharge: 0, boosting: false, boostTimer: 0, superBoostTimer: 0,
          items: [], selectedIndex: 0, spinTimer: 0, slowTimer: 0, shieldTimer: 0, starTimer: 0, holeTimer: 0, holeEscapeZ: 0, boostPadCooldown: 0,
          shortcutCooldown: 0, jumpCooldown: 0, airTimer: 0,
          laps: 0, lapStart: 0, bestLap: Infinity,
          finished: false, finishTime: 0, position: 1,
        };
      }

      const GRID_LANES = [-0.75, -0.25, 0.25, 0.75]; // 4-wide staggered grid, well clear of COLLISION_X

      const AI_NAME_POOL = [
        'Turbo Jax', 'Nitro Belle', 'Ziggy Blaze', 'Rusty Volt', 'Coco Dash',
        'Max Skid', 'Vera Vroom', 'Dizzy Drift', 'Karl Krunch', 'Pixie Torque',
        'Bruno Sparks', 'Lola Redline', 'Snap Gearz', 'Ruby Rumble', 'Otto Boost',
        'Mimi Hazard', 'Duke Fender', 'Skye Racer', 'Gizmo Grit', 'Nova Slick',
      ];
      function pickAiNames(n) {
        const pool = [...AI_NAME_POOL];
        const picked = [];
        for (let i = 0; i < n; i++) {
          const idx = pool.length ? Math.floor(Math.random() * pool.length) : -1;
          picked.push(idx >= 0 ? pool.splice(idx, 1)[0] : `CPU ${i + 1}`);
        }
        return picked;
      }

      function buildGrid(count) {
        const list = [];
        const aiNames = pickAiNames(TOTAL_KARTS - count);
        let aiIndex = 0;
        for (let i = 0; i < TOTAL_KARTS; i++) {
          const isAI = i >= count;
          const row = Math.floor(i / GRID_LANES.length), lane = i % GRID_LANES.length;
          list.push(createCar({
            id: i,
            name: isAI ? aiNames[aiIndex++] : `P${i + 1}`,
            color: PALETTE[i],
            playerNum: isAI ? null : i + 1,
            isAI,
            startX: GRID_LANES[lane],
            startZ: -track.segmentLength * (row + 1) * 1.6,
          }));
        }
        return list;
      }

      function getCarByPlayerNum(n) { return cars.find((c) => c.playerNum === n); }

      // Starts (or restarts) a boost. If the car is already mid-boost, this
      // is a *stacked* boost — flag it so the flame renders hot blue
      // instead of orange (see drawNitroFlame) for the rest of this boost,
      // same "stacked nitro" cue as a Mario Kart-style blue flame.
      function triggerBoost(car, duration) {
        if (car.boosting) car.superBoostTimer = Math.max(car.superBoostTimer, duration);
        car.boosting = true;
        car.boostTimer = duration;
      }

      function tryBoost(car) {
        if (phase !== 'racing' || paused || car.finished || car.spinTimer > 0) return;
        if (!car.boosting && car.boostCharge >= 30) {
          triggerBoost(car, 1.0 + (car.boostCharge / 100) * 2.2); // was 0.4 + *1.1 — too short
          car.boostCharge = 0;
        }
      }

      // Shield and star both block incoming bomb/side/slow/swap effects —
      // star additionally lets its holder spin out anyone *they* touch
      // (see resolveCollisions), which shield does not.
      function isProtected(car) { return car.shieldTimer > 0 || car.starTimer > 0; }

      function spinOut(car) {
        if (isProtected(car)) return;
        car.spinTimer = 1.1;
        car.speed *= 0.25;
      }

      // Instant, non-thrown: spins out anyone currently alongside the user
      // (close in z, offset in x — not already overlapping) rather than
      // aiming forward like the projectile items.
      function useSideHit(car) {
        for (const other of cars) {
          if (other === car || other.finished || other.spinTimer > 0) continue;
          const dz = Math.abs(other.totalDistance - car.totalDistance);
          const dx = Math.abs(other.x - car.x);
          if (dz < 150 && dx > 0.15 && dx < 0.9) spinOut(other);
        }
      }

      // Triangle: cycle which held item is "selected" (armed) without using
      // it — Square fires whichever one is currently selected.
      function cycleSelectedItem(car) {
        if (phase !== 'racing' || paused || car.finished || car.items.length === 0) return;
        car.selectedIndex = (car.selectedIndex + 1) % car.items.length;
      }

      function tryUseItem(car) {
        if (phase !== 'racing' || paused || car.finished || car.items.length === 0) return;
        const idx = clamp(car.selectedIndex, 0, car.items.length - 1);
        const kind = car.items.splice(idx, 1)[0];
        car.selectedIndex = car.items.length ? Math.min(idx, car.items.length - 1) : 0;
        if (kind === 'boost') {
          triggerBoost(car, 2.2); // was 1.0 — too short
        } else if (kind === 'side') {
          useSideHit(car);
        } else if (kind === 'shield') {
          car.shieldTimer = 10.0; // blocks bomb/side-hit spin-outs, slow, and being swapped
        } else if (kind === 'star') {
          car.starTimer = 6.0; // shield's protection, plus spins out anyone you touch
        } else if (kind === 'banana') {
          // Dropped in place, not thrown — a stationary hazard for whoever's
          // chasing close behind. speed: 0 means updateProjectiles' own sweep
          // can't catch a fast car running it over; that check also sweeps
          // each car's own pre-move position for exactly this case.
          projectiles.push({ ownerId: car.id, x: car.x, z: car.totalDistance - 90, speed: 0, life: 20, hit: false, kind });
        } else if (kind === 'missile') {
          // Locks onto whoever is 1st place *right now* and ignores everyone
          // else in flight (see updateProjectiles) — a blue-shell-style
          // pressure valve. Wasted (no target) if the thrower is already 1st.
          const leader = cars.find((c) => c.position === 1);
          projectiles.push({
            ownerId: car.id, x: car.x, z: car.totalDistance + 80, speed: car.speed + 16000, life: 10, hit: false, kind,
            targetId: leader && leader.id !== car.id ? leader.id : null,
          });
        } else {
          // bomb / swap / slow: forward-thrown projectiles, same aiming as
          // each other, differing only in what happens on hit. Speed bumped
          // (was +7000) and the hit window below widened — at the old
          // values, closing speed vs. hit radius meant a fast-closing
          // projectile could tunnel past its target within a single frame,
          // same class of bug as the earlier hole/collision tunneling fixes.
          projectiles.push({ ownerId: car.id, x: car.x, z: car.totalDistance + 80, speed: car.speed + 11000, life: 6, hit: false, kind });
        }
      }

      // Is `car` currently over any hazard in `list` (each {segmentIndex, x}).
      // Checked against the *swept* path the car covers this frame (its
      // current z through z + speed*dt) padded by the hazard's own
      // footprint, not a big flat radius around a point — a flat radius
      // wide enough to stop a boosted kart from tunneling past a hole in
      // one frame (frame travel can exceed a full segment length at top
      // boost) was also wide enough to trigger the hazard well before the
      // kart was ever visibly on top of it. Sweeping the actual distance
      // traveled this frame keeps the fast-car case safe while staying
      // tight to the hazard's true visual footprint the rest of the time.
      // Returns the matched hazard's absolute world-z (in the car's current
      // lap), not just a boolean, so callers that need to escape a specific
      // spot (see the hole-exit nudge below) know exactly where it is
      // rather than guessing a fixed offset.
      const HAZARD_Z_PAD = 55; // half the hazard's own footprint, world units
      function findNearHazard(car, list, xRadius, dt) {
        const zStart = car.totalDistance;
        const zEnd = zStart + car.speed * dt;
        const zLo = Math.min(zStart, zEnd) - HAZARD_Z_PAD;
        const zHi = Math.max(zStart, zEnd) + HAZARD_Z_PAD;
        const lapZ = ((zStart % track.length) + track.length) % track.length;
        const lapBase = zStart - lapZ;
        for (const h of list) {
          const hzAbs = lapBase + h.segmentIndex * track.segmentLength;
          if (hzAbs >= zLo && hzAbs <= zHi && Math.abs(car.x - h.x) < xRadius) return hzAbs;
        }
        return null;
      }
      function nearHazard(car, list, xRadius, dt) {
        return findNearHazard(car, list, xRadius, dt) !== null;
      }

      function updateCarPhysics(car, input, dt, now) {
        if (car.finished) return;
        if (car.holeTimer > 0) {
          car.holeTimer = Math.max(0, car.holeTimer - dt);
          // The car hasn't moved all stun — it's still sitting exactly on
          // the hole. Without a nudge clear of the hole's trigger radius,
          // the very next tick would just detect it's still there and fall
          // in again forever. A flat "+200" nudge isn't reliable here: if
          // the car fell in from deep on the *behind* side of the trigger
          // radius, +200 can still land it inside the radius on the far
          // side, re-triggering immediately (confirmed this happens).
          // Nudge relative to the hole's actual position instead, so it's
          // guaranteed clear regardless of which side it was entered from.
          if (car.holeTimer === 0) {
            car.totalDistance = Math.max(car.totalDistance + 20, (car.holeEscapeZ ?? car.totalDistance) + 60);
          }
          return;
        }
        let steer = clamp(input.steer, -1, 1);
        let throttle = input.throttle, brake = input.brake;
        if (car.spinTimer > 0) {
          car.spinTimer = Math.max(0, car.spinTimer - dt);
          steer = Math.sin(now * 0.02) * 0.6;
          throttle = false; brake = false;
        }
        const segment = Track.segmentAt(track, car.totalDistance);
        const speedPercent = car.speed / MAX_SPEED;
        // A small steering floor even at (near-)zero speed so a stalled car
        // can still turn itself back toward the road instead of being stuck
        // facing a wall with no way to react.
        const dx = dt * (2 * speedPercent + 0.22);
        car.x += dx * steer;
        // gripMultiplier (from the selected race condition, e.g. Rain) scales
        // how hard the road pushes back against a curve — higher means more
        // slide, i.e. less grip.
        car.x -= dx * speedPercent * segment.curve * CENTRIFUGAL * activeConditions.gripMultiplier;

        // While airborne off a jump ramp, off-road/grease/holes can't touch
        // you — captured *before* this frame's airTimer decay below, so a
        // ramp hit this frame doesn't retroactively grant immunity for the
        // frame it was triggered on.
        const airborne = car.airTimer > 0;
        const offroad = !airborne && Math.abs(car.x) > 1;
        const inGrease = !airborne && nearHazard(car, track.greasePatches, 0.35, dt);
        // Off-road is a real but escapable penalty: weaker accel and a much
        // lower top speed, not a decel that can outrun full throttle — that
        // combination made off-road speed clamp to exactly 0 forever.
        if (throttle) car.speed += ACCEL * (offroad ? 0.45 : inGrease ? 0.6 : 1) * dt;
        if (brake) car.speed -= BRAKE_DECEL * dt;
        if (!throttle && !brake) car.speed -= ENGINE_DECEL * (offroad ? 0.5 : 1) * dt;

        if (car.boosting) {
          car.boostTimer -= dt;
          if (car.boostTimer <= 0) { car.boosting = false; car.superBoostTimer = 0; }
        }
        if (car.superBoostTimer > 0) car.superBoostTimer = Math.max(0, car.superBoostTimer - dt);
        if (car.slowTimer > 0) car.slowTimer = Math.max(0, car.slowTimer - dt);
        if (car.shieldTimer > 0) car.shieldTimer = Math.max(0, car.shieldTimer - dt);
        if (car.starTimer > 0) car.starTimer = Math.max(0, car.starTimer - dt);
        if (car.airTimer > 0) {
          car.airTimer = Math.max(0, car.airTimer - dt);
          if (car.airTimer === 0) triggerBoost(car, 1.2); // landing boost — the reward for timing a jump
        }
        // Threshold lowered from 0.45 and charge rate raised from 55 —
        // drifting was hard to trigger and slow to pay off for players.
        const drifting = Math.abs(steer) > 0.5 && !offroad && speedPercent > 0.32 && car.spinTimer <= 0;
        car.boostCharge = clamp(car.boostCharge + (drifting ? dt * 68 : -dt * 8), 0, 100);

        // Penalties (offroad, grease, the slow-item debuff) cap effective top
        // speed even mid-boost — a boost shouldn't cancel out a hazard.
        const cap = offroad ? OFFROAD_MAX_SPEED
          : inGrease ? car.maxSpeed * 0.45
          : car.slowTimer > 0 ? car.maxSpeed * 0.55
          : (car.boosting ? car.maxSpeed * BOOST_MULTIPLIER : car.maxSpeed);
        car.speed = clamp(car.speed, 0, cap * activeConditions.speedMultiplier);
        car.x = clamp(car.x, -1.6, 1.6);

        if (car.jumpCooldown > 0) {
          car.jumpCooldown = Math.max(0, car.jumpCooldown - dt);
        } else if (nearHazard(car, track.jumpRamps, 0.4, dt)) {
          car.airTimer = 1.0;
          car.jumpCooldown = 1.6;
        }
        // Cutting a corner deep off-road (past the shoulder, matching side)
        // flings the car `skip` world units further down the track — net
        // time saved despite the off-road speed penalty on the way there.
        // No swept/tunneling guard needed here unlike the hazards above:
        // missing the trigger just means no shortcut that pass, not a
        // fairness bug like tunneling through a punishing hazard would be.
        if (car.shortcutCooldown > 0) {
          car.shortcutCooldown = Math.max(0, car.shortcutCooldown - dt);
        } else if (Math.abs(car.x) > 1.15) {
          const lapZ = ((car.totalDistance % track.length) + track.length) % track.length;
          for (const sc of track.shortcuts) {
            const scZ = sc.segmentIndex * track.segmentLength;
            if (Math.abs(lapZ - scZ) < 150 && Math.sign(car.x) === Math.sign(sc.x)) {
              car.totalDistance += sc.skip;
              car.shortcutCooldown = 4.0;
              break;
            }
          }
        }

        // Check boost pads/holes against the *pre-move* position, not the
        // post-move one below, and sweep the frame's actual travel distance
        // (see findNearHazard) — a fast car covers more ground in one frame
        // than the hazard's own footprint, so a naive post-move point check
        // could sail past a hole without ever registering inside it (same
        // class of single-frame-tunneling bug as the kart-vs-kart collision
        // fix earlier this session).
        if (car.boostPadCooldown > 0) {
          car.boostPadCooldown = Math.max(0, car.boostPadCooldown - dt);
        } else if (nearHazard(car, track.boostPads, 0.4, dt)) {
          triggerBoost(car, 2.2); // was 1.0 — too short
          car.boostPadCooldown = 1.5;
        }
        const holeZ = airborne ? null : findNearHazard(car, track.holes, 0.35, dt);
        if (holeZ !== null) {
          car.holeTimer = 3.0;
          car.speed = 0;
          car.holeEscapeZ = holeZ + HAZARD_Z_PAD + 30; // just past this specific hole's trigger zone
        }

        car.totalDistance += car.speed * dt;

        const lapsNow = Math.max(0, Math.floor(car.totalDistance / track.length));
        if (lapsNow > car.laps) {
          if (car.lapStart) car.bestLap = Math.min(car.bestLap, now - car.lapStart);
          car.lapStart = now;
          car.laps = lapsNow;
          if (car.laps >= TARGET_LAPS) {
            car.finished = true;
            car.finishTime = now - raceStartedAt;
          }
        }
      }

      // Item boxes don't hand out a uniform random item — how far back you
      // are shifts the odds, same rubber-band logic as Mario Kart: leaders
      // mostly get utility (boost/shield), trailing racers get a real shot
      // at the offensive stuff (missile only exists for the back half —
      // it's wasted on whoever's already 1st).
      function pickWeightedItem(car) {
        const rank = TOTAL_KARTS > 1 ? (car.position - 1) / (TOTAL_KARTS - 1) : 0; // 0 = leader, 1 = last
        const weights = {
          boost: 3 - 2 * rank,
          shield: 2 - rank,
          banana: 1,
          side: 1 + rank,
          swap: 1,
          slow: 1 + rank,
          star: 0.3 + 1.2 * rank,
          missile: rank < 0.5 ? 0 : (rank - 0.5) * 4,
        };
        let total = 0;
        for (const k of ITEM_KINDS) total += Math.max(0, weights[k] ?? 1);
        let r = Math.random() * total;
        for (const k of ITEM_KINDS) {
          r -= Math.max(0, weights[k] ?? 1);
          if (r <= 0) return k;
        }
        return ITEM_KINDS[ITEM_KINDS.length - 1];
      }

      function checkItemPickups(now) {
        for (const box of itemBoxes) {
          if (!box.active && now >= box.respawnAt) box.active = true;
        }
        for (const car of cars) {
          if (car.finished || car.items.length >= ITEM_CAP) continue;
          const lapZ = ((car.totalDistance % track.length) + track.length) % track.length;
          for (const box of itemBoxes) {
            if (!box.active) continue;
            const boxZ = box.segmentIndex * track.segmentLength;
            if (Math.abs(lapZ - boxZ) < 110 && Math.abs(car.x - box.x) < 0.4) {
              car.items.push(pickWeightedItem(car));
              box.active = false;
              box.respawnAt = now + 4000;
              break; // one box per car per pass, even inside a 4-wide row
            }
          }
        }
      }

      // Bomb/slow/swap projectiles always travel forward toward whoever's
      // ahead of the thrower — which means, from the target's point of
      // view, they approach from directly behind. The chase-cam only ever
      // looks forward, so there's no way to actually see one coming in the
      // 3D scene; this is a HUD-only warning so the player gets *some*
      // signal before it hits (distance still gives a moment to swerve,
      // since the hit check has an x-lane tolerance).
      const THREAT_WARNING_RANGE = 2200;
      function findIncomingThreat(car) {
        let closest = null;
        for (const p of projectiles) {
          if (p.hit || p.ownerId === car.id) continue;
          if (p.kind !== 'bomb' && p.kind !== 'slow' && p.kind !== 'swap' && p.kind !== 'missile') continue;
          if (p.kind === 'missile' && p.targetId !== car.id) continue; // locked on — only its target gets the warning
          const behindDist = car.totalDistance - p.z; // positive = still behind car, closing in
          if (behindDist > 0 && behindDist < THREAT_WARNING_RANGE && Math.abs(car.x - p.x) < 0.6) {
            if (!closest || behindDist < closest.dist) closest = { kind: p.kind, dist: behindDist };
          }
        }
        return closest;
      }

      function drawThreatWarning(left, top, w, h, threat) {
        if (!threat) return;
        const urgency = 1 - clamp(threat.dist / THREAT_WARNING_RANGE, 0, 1); // 0 far .. 1 about to hit
        const pulse = 0.5 + 0.5 * Math.sin(performance.now() * (0.012 + urgency * 0.02));
        const color = ITEM_COLORS[threat.kind] || '#ff3b3b';
        const barH = 16 + urgency * 34;

        ctx.save();
        const grad = ctx.createLinearGradient(0, top + h - barH, 0, top + h);
        grad.addColorStop(0, 'rgba(0,0,0,0)');
        grad.addColorStop(1, color);
        ctx.globalAlpha = 0.3 + 0.5 * pulse * (0.4 + urgency * 0.6);
        ctx.fillStyle = grad;
        ctx.fillRect(left, top + h - barH, w, barH);
        ctx.restore();

        ctx.save();
        ctx.globalAlpha = 0.55 + 0.45 * pulse;
        ctx.fillStyle = '#fff';
        ctx.font = `900 ${14 + urgency * 6}px "Baloo 2", Arial`;
        ctx.textAlign = 'center';
        const textY = top + h - barH - 12;
        ctx.fillText('INCOMING', left + w / 2, textY);
        // Small chevrons pointing down toward the bottom edge, where the
        // threat is conceptually coming from (behind/off-screen).
        const chevW = 9, chevH = 6;
        for (const dx of [-46, 46]) {
          ctx.beginPath();
          ctx.moveTo(left + w / 2 + dx - chevW, textY - chevH - 2);
          ctx.lineTo(left + w / 2 + dx, textY + 2);
          ctx.lineTo(left + w / 2 + dx + chevW, textY - chevH - 2);
          ctx.strokeStyle = color;
          ctx.lineWidth = 3;
          ctx.lineJoin = 'round';
          ctx.lineCap = 'round';
          ctx.stroke();
        }
        ctx.restore();
      }

      // `prevZ` is each car's totalDistance from before this frame's physics
      // ran (same snapshot resolveCollisions uses), indexed by car.id — cars
      // are created with id === their array index, so prevZ[car.id] works.
      function updateProjectiles(dt, prevZ) {
        for (const p of projectiles) {
          const prevPz = p.z;
          if (p.kind === 'missile' && p.targetId != null) {
            const target = cars.find((c) => c.id === p.targetId);
            if (target && !target.finished) {
              // Steers its x toward the target's lane at a bounded turn
              // rate rather than snapping straight to it — a visible curve
              // into the target's line, not a teleport.
              p.x = clamp(p.x + clamp(target.x - p.x, -1, 1) * dt * 3, -1.6, 1.6);
            }
          }
          p.z += p.speed * dt;
          p.life -= dt;
          if (p.hit) continue;
          // Swept check against BOTH the projectile's and each car's own
          // before→after movement this frame, not a fixed radius around the
          // post-move position — at close range + high closing speed, a
          // single frame's movement can be larger than any reasonable fixed
          // radius (verified: throw at 12000, target at 2000, 200-unit gap
          // still missed at a 200-unit radius). Sweeping only the
          // projectile's motion isn't enough either: a *stationary* banana
          // (speed 0) has almost no swept band of its own, so a fast car
          // could tunnel straight through it without sweeping the car's own
          // motion too.
          const zMin = Math.min(prevPz, p.z) - 60;
          const zMax = Math.max(prevPz, p.z) + 60;
          for (const car of cars) {
            if (car.id === p.ownerId || car.finished || car.spinTimer > 0) continue;
            // Blue-shell style: a locked-on missile ignores every other kart
            // in flight, even ones it visually passes through.
            if (p.kind === 'missile' && p.targetId != null && car.id !== p.targetId) continue;
            const carPrevZ = prevZ ? prevZ[car.id] : car.totalDistance;
            const carMin = Math.min(carPrevZ, car.totalDistance);
            const carMax = Math.max(carPrevZ, car.totalDistance);
            const overlaps = carMax >= zMin && carMin <= zMax;
            if (overlaps && Math.abs(car.x - p.x) < 0.4) {
              if (p.kind === 'bomb' || p.kind === 'banana' || p.kind === 'missile') {
                spinOut(car); // spinOut itself is shield/star-aware
              } else if (p.kind === 'slow') {
                if (!isProtected(car)) { car.slowTimer = 2.5; car.speed *= 0.6; }
              } else if (p.kind === 'swap' && !isProtected(car)) {
                const thrower = cars.find((c) => c.id === p.ownerId);
                if (thrower) {
                  const tz = thrower.totalDistance, tx = thrower.x;
                  thrower.totalDistance = car.totalDistance; thrower.x = car.x;
                  car.totalDistance = tz; car.x = tx;
                }
              }
              // The projectile still "hits" (and is consumed) even when
              // shield/star blocks the effect — it bounces off rather than
              // sailing through to hit whoever's behind the protected car.
              p.hit = true;
              break;
            }
          }
        }
        projectiles = projectiles.filter((p) => p.life > 0 && !p.hit);
      }

      // Pairwise bumper-car resolution: two karts are "in the collision box"
      // only when they're close on BOTH axes at once (narrow lane AND close
      // following distance). When they are, both axes get corrected in the
      // same pass — sideways to relieve a side-by-side squeeze, front-to-back
      // to enforce a minimum following gap so a trailing kart can't phase
      // through the one ahead. (Picking only *one* axis to resolve, based on
      // comparing normalized overlap fractions, doesn't work here: the lane
      // is narrow so lateral overlap always looks "severe" on that scale,
      // starving out the longitudinal correction that actually matters for a
      // rear-end — verified this the hard way before removing it.)
      //
      // `prevZ` is each car's totalDistance from *before* this frame's physics
      // ran, snapshotted by the caller. At high closing speeds a fast car can
      // fully overtake a slow one's position within a single frame — if the
      // push direction were computed from the (now-flipped) current order,
      // the correction would reinforce the tunnel-through instead of undoing
      // it. Using the pre-frame order as the stable reference direction fixes
      // that: the correction still points the right way even after a
      // same-frame flip, and a bigger flip just produces a bigger push back
      // toward a legal gap.
      function resolveCollisions(prevZ) {
        for (let i = 0; i < cars.length; i++) {
          const a = cars[i];
          if (a.finished) continue;
          for (let j = i + 1; j < cars.length; j++) {
            const b = cars[j];
            if (b.finished) continue;
            const dz = b.totalDistance - a.totalDistance;
            const prevDz = prevZ[j] - prevZ[i];
            const dirBase = prevDz !== 0 ? prevDz : (dz !== 0 ? dz : (Math.random() < 0.5 ? -1 : 1));
            const dir = Math.sign(dirBase);
            const signedGap = dz * dir; // >0: b still ahead of a along the stable direction; <0: order flipped this frame

            const dx = b.x - a.x;
            if (signedGap >= COLLISION_Z || Math.abs(dx) >= COLLISION_X) continue;

            const zPush = (COLLISION_Z - signedGap) * 0.5;
            a.totalDistance -= zPush * dir;
            b.totalDistance += zPush * dir;
            // Extra speed bleed for whichever kart is doing the ramming.
            if (dir > 0) a.speed *= 0.9; else b.speed *= 0.9;

            // Star: touching another kart spins them out (shield only
            // blocks incoming effects, it doesn't do this) — skip when both
            // are starred so they don't just spin each other every frame.
            if (a.starTimer > 0 && !(b.starTimer > 0)) spinOut(b);
            else if (b.starTimer > 0 && !(a.starTimer > 0)) spinOut(a);

            // Only push apart laterally when there's an actual lateral
            // offset — a straight-behind kart (dx≈0) isn't a side-by-side
            // squeeze, and nudging it apart anyway risks landing |dx| right
            // on the COLLISION_X boundary, which would make next frame's
            // quick-reject above think the pair stopped colliding entirely
            // and silently disable the Z correction while the ram continues.
            if (Math.abs(dx) > 0.01) {
              const xPush = (COLLISION_X - Math.abs(dx)) * 0.5;
              const xDir = Math.sign(dx);
              a.x = clamp(a.x - xPush * xDir, -1.6, 1.6);
              b.x = clamp(b.x + xPush * xDir, -1.6, 1.6);
            }

            a.speed *= 0.985;
            b.speed *= 0.985;
          }
        }
      }

      function sortKey(car) { return car.finished ? Number.MAX_SAFE_INTEGER - car.finishTime : car.totalDistance; }
      function updateRanking() {
        const sorted = [...cars].sort((a, b) => sortKey(b) - sortKey(a));
        sorted.forEach((car, i) => { car.position = i + 1; });
      }

      function tickRace(dt, now) {
        const humans = cars.filter((c) => !c.isAI);
        const prevZ = cars.map((c) => c.totalDistance);
        for (const car of cars) {
          if (car.isAI) {
            AI.applyRubberband(car, humans, MAX_SPEED, activeDifficulty);
            const input = AI.computeAIInput(car, track, cars, activeConditions, activeDifficulty);
            if (input.wantBoost) tryBoost(car);
            if (input.wantItem) tryUseItem(car);
            updateCarPhysics(car, input, dt, now);
          } else {
            const c = controls[car.playerNum] || {};
            const input = { steer: (c.left ? -1 : 0) + (c.right ? 1 : 0), throttle: !!c.up, brake: !!c.down };
            updateCarPhysics(car, input, dt, now);
          }
        }
        resolveCollisions(prevZ);
        checkItemPickups(now);
        updateProjectiles(dt, prevZ);
        updateRanking();
        // Finishing takes priority over the clock — a human who crosses the
        // line the same frame the timer would've expired still made it.
        if (humans.length && humans.every((c) => c.finished)) finishRace();
        else if (timerModeActive && now - raceStartedAt >= raceTimeLimitMs) failRace();
      }

      function projectedZFor(viewerZ, segmentIndex) {
        const lap = Math.floor(viewerZ / track.length);
        let z = segmentIndex * track.segmentLength + lap * track.length;
        if (z - viewerZ < -track.length / 2) z += track.length;
        return z;
      }

      function buildSprites(viewerCar, viewportW) {
        const sprites = [];
        // The viewer's own kart is a fixed-size screen overlay (drawPlayerOverlay,
        // ~viewportW*0.1), but another kart's billboard scale grows without
        // bound as it approaches the camera (that's correct perspective math,
        // but at point-blank range it dwarfs the fixed-size overlay and reads
        // as broken rather than "close"). Cap it to stay visually consistent
        // with your own kart's size even nose-to-tail.
        const kartScaleCap = viewportW * 0.16;
        for (const car of cars) {
          if (car === viewerCar) continue;
          sprites.push({ x: car.x, z: car.totalDistance, draw: (c, s) => drawKart(c, Math.min(s * 0.9, kartScaleCap), car) });
        }
