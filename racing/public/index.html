        for (const box of itemBoxes) {
          if (!box.active) continue;
          sprites.push({ x: box.x, z: projectedZFor(viewerCar.totalDistance, box.segmentIndex), draw: (c, s) => drawItemBoxShape(c, s * 0.55) });
        }
        for (const p of projectiles) {
          sprites.push({ x: p.x, z: p.z, draw: (c, s) => drawProjectileShape(c, s * 0.35, p.kind) });
        }
        for (const pad of track.boostPads) {
          sprites.push({ x: pad.x, z: projectedZFor(viewerCar.totalDistance, pad.segmentIndex), draw: (c, s) => drawBoostPadShape(c, s * 0.7) });
        }
        for (const patch of track.greasePatches) {
          sprites.push({ x: patch.x, z: projectedZFor(viewerCar.totalDistance, patch.segmentIndex), draw: (c, s) => drawGreasePatchShape(c, s * 0.7) });
        }
        for (const hole of track.holes) {
          sprites.push({ x: hole.x, z: projectedZFor(viewerCar.totalDistance, hole.segmentIndex), draw: (c, s) => drawHoleShape(c, s * 0.7) });
        }
        for (const ramp of track.jumpRamps) {
          sprites.push({ x: ramp.x, z: projectedZFor(viewerCar.totalDistance, ramp.segmentIndex), draw: (c, s) => drawJumpRampShape(c, s * 0.7) });
        }
        for (const sc of track.shortcuts) {
          sprites.push({ x: sc.x, z: projectedZFor(viewerCar.totalDistance, sc.segmentIndex), draw: (c, s) => drawShortcutArrowShape(c, s * 0.6, sc.x) });
        }
        // Scenery is authored densely (every ~10 segments, both sides) so
        // it reads as a continuous tree line rather than sparse cutouts —
        // skip anything outside the actual draw distance up front instead
        // of building a sprite object (with its own closure) for every one
        // of the few hundred authored entries every single frame.
        const sceneryHorizon = Render.DRAW_DISTANCE * track.segmentLength;
        for (const item of track.scenery) {
          const z = projectedZFor(viewerCar.totalDistance, item.segmentIndex);
          if (z < viewerCar.totalDistance || z - viewerCar.totalDistance > sceneryHorizon) continue;
          sprites.push({ x: item.x, z, draw: (c, s) => drawSceneryShape(c, s * (item.kind === 'lamp' ? 0.55 : item.kind === 'rail' ? 0.6 : 1.05), item.kind) });
        }
        return sprites;
      }

      function drawPlayerOverlay(car, w, h) {
        ctx.save();
        ctx.translate(w / 2 + car.x * w * 0.16, h * 0.88);
        ctx.translate(0, Math.sin(performance.now() * 0.02) * Math.min(3, car.speed / 4000));
        drawKart(ctx, w * 0.1, car);
        ctx.restore();
      }

      // Streaking rain lines over the viewport — the grip penalty alone
      // (a bigger CENTRIFUGAL multiplier) is invisible until a car actually
      // hits a curve, so a player has no way to tell rain is even active
      // without this. Index-seeded rather than Math.random() per streak so
      // each one falls at a consistent x/speed/length instead of jittering.
      function drawRainOverlay(w, h) {
        const t = performance.now();
        ctx.save();
        ctx.strokeStyle = 'rgba(210,225,255,.4)';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        const cols = 46;
        for (let i = 0; i < cols; i++) {
          const seed = i * 971;
          const speed = 900 + (seed % 400);
          const len = 22 + (seed % 18);
          const x = (seed % w) + Math.sin(t * 0.0003 + i) * 6;
          const y = ((t * speed / 1000) + (seed % h)) % (h + len) - len;
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x - 4, y + len);
          ctx.stroke();
        }
        ctx.restore();
      }

      function renderViewport(car, left, top, w, h) {
        ctx.save();
        ctx.beginPath();
        ctx.rect(left, top, w, h);
        ctx.clip();
        ctx.translate(left, top);
        Render.renderScene(ctx, track, car, w, h, buildSprites(car, w), activeConditions);
        drawPlayerOverlay(car, w, h);
        if (activeConditions.rain) drawRainOverlay(w, h);
        ctx.restore();
        ctx.strokeStyle = 'rgba(255,255,255,.18)';
        ctx.strokeRect(left, top, w, h);
        Render.drawHudPanel(ctx, left, top, w, h, car, TARGET_LAPS);
        if (!isProtected(car)) drawThreatWarning(left, top, w, h, findIncomingThreat(car));
      }

      function draw() {
        ctx.clearRect(0, 0, W, H);
        const humans = cars.filter((c) => !c.isAI);
        if (humans.length <= 1) {
          if (humans[0]) renderViewport(humans[0], 0, 0, W, H);
        } else {
          renderViewport(humans[0], 0, 0, W / 2, H);
          renderViewport(humans[1], W / 2, 0, W / 2, H);
        }
        Render.drawMinimap(ctx, W - 210, 16, 190, 130, track, cars, new Set(humans.map((c) => c.id)));
      }

      function formatTime(ms) {
        const total = Math.max(0, Math.floor(ms / 1000));
        const min = String(Math.floor(total / 60)).padStart(2, '0');
        const sec = String(total % 60).padStart(2, '0');
        return `${min}:${sec}`;
      }

      // Shared by both race-end paths (someone finished / the clock ran out
      // in Time Attack) — renders the same standings list either way,
      // just with a different headline.
      function endRace(title) {
        if (phase === 'finished') return;
        phase = 'finished';
        const humansSet = new Set(cars.filter((c) => !c.isAI).map((c) => c.id));
        const sorted = [...cars].sort((a, b) => sortKey(b) - sortKey(a));
        const list = document.getElementById('podiumList');
        list.innerHTML = '';
        sorted.forEach((car, i) => {
          const row = document.createElement('div');
          row.className = 'podium-row' + (humansSet.has(car.id) ? ' me' : '');
          row.innerHTML = `<span class="pos display-font">${Render.ordinal(i + 1)}</span><span class="swatch" style="background:${car.color}"></span><span class="name">${car.name}</span><span class="time">${car.finished ? formatTime(car.finishTime) : 'DNF'}</span>`;
          list.appendChild(row);
        });
        document.getElementById('podiumTitle').textContent = title ?? `${sorted[0].name} WINS!`;
        document.getElementById('podiumOverlay').style.display = 'flex';
      }

      function finishRace() {
        // In Time Attack the win condition is personal (beat the clock),
        // not "beat the other racers" — an AI opponent finishing first is
        // still a win for the human as long as they made it too.
        const title = timerModeActive ? 'YOU MADE IT!' : undefined;
        endRace(title);
      }

      function failRace() {
        endRace("TIME'S UP!");
      }

      function startCountdown(now) {
        phase = 'countdown';
        countdownStartedAt = now;
        document.getElementById('lobby').style.display = 'none';
        document.getElementById('playBar').style.display = 'none';
        document.getElementById('topBar').style.display = 'flex';
        document.getElementById('topBarLabel').textContent = mode === 'timer' ? 'TIME ATTACK' : mode === 'ai' ? 'RACE VS CPU' : 'TWO PLAYER RACE';
        document.getElementById('timerDisplay').style.display = timerModeActive ? 'inline-block' : 'none';
        document.getElementById('countdownOverlay').style.display = 'flex';
        canvas.style.display = 'block';
      }

      function updateCountdown(now) {
        const elapsed = now - countdownStartedAt;
        const el = document.getElementById('countdownNum');
        if (elapsed < 900) { el.textContent = '3'; el.className = 'display-font c-three'; }
        else if (elapsed < 1800) { el.textContent = '2'; el.className = 'display-font c-two'; }
        else if (elapsed < 2700) { el.textContent = '1'; el.className = 'display-font c-one'; }
        else if (elapsed < 3400) { el.textContent = 'GO!'; el.className = 'display-font c-go'; }
        else {
          document.getElementById('countdownOverlay').style.display = 'none';
          phase = 'racing';
          raceStartedAt = now;
          cars.forEach((c) => { c.lapStart = now; });
        }
      }

      function updateTimerDisplay(now) {
        if (!timerModeActive) return;
        const remainingMs = Math.max(0, raceTimeLimitMs - (now - raceStartedAt));
        const el = document.getElementById('timerDisplay');
        el.textContent = formatTime(remainingMs);
        el.classList.toggle('urgent', remainingMs < 10000);
      }

      function frameTick() {
        const now = performance.now();
        const dt = Math.min(0.033, (now - lastFrame) / 1000 || 0.016);
        lastFrame = now;
        pollGamepads();
        if (phase === 'countdown') updateCountdown(now);
        else if (phase === 'racing' && !paused) { tickRace(dt, now); updateTimerDisplay(now); }
        if (phase !== 'lobby') draw();
        rafId = requestAnimationFrame(frameTick);
      }

      function startGame(selectedMode) {
        if (rafId !== null) cancelAnimationFrame(rafId); // see rafId comment above
        mode = selectedMode;
        humanCount = selectedMode === 'two' ? 2 : 1; // 'ai' and 'timer' both play one human vs a full AI grid
        timerModeActive = selectedMode === 'timer';
        activeConditions = CONDITIONS[selectedConditionId] || CONDITIONS[DEFAULT_CONDITION];
        activeDifficulty = DIFFICULTIES[selectedDifficultyId] || DIFFICULTIES[DEFAULT_DIFFICULTY];
        track = Track.buildTrack(selectedTrackId); // must happen before buildGrid()/itemBoxes below
        raceTimeLimitMs = Math.round(track.length * TIME_ATTACK_PACE_MS_PER_UNIT * TIME_ATTACK_BUFFER);
        cars = buildGrid(humanCount);
        itemBoxes = track.itemBoxSegments.map((b) => ({ segmentIndex: b.segmentIndex, x: b.x, active: true, respawnAt: 0 }));
        projectiles = [];
        controls[1] = { left: false, right: false, up: false, down: false };
        controls[2] = { left: false, right: false, up: false, down: false };
        paused = false;
        document.getElementById('pauseOverlay').style.display = 'none';
        document.getElementById('podiumOverlay').style.display = 'none';
        updateRanking();
        startCountdown(performance.now());
        lastFrame = performance.now();
        rafId = requestAnimationFrame(frameTick);
      }

      function togglePause() {
        if (phase !== 'racing') return;
        paused = !paused;
        document.getElementById('pauseOverlay').style.display = paused ? 'flex' : 'none';
      }

      // Bails out of a race in progress (from the pause menu) back to the
      // lobby, instead of the only prior way out being a full page refresh.
      // Cancelling rafId here matters — without it, the still-running frame
      // loop from this race would keep alive alongside whatever loop the
      // next startGame() spins up (see the rafId comment above).
      function quitToLobby() {
        if (rafId !== null) { cancelAnimationFrame(rafId); rafId = null; }
        phase = 'lobby';
        paused = false;
        document.getElementById('pauseOverlay').style.display = 'none';
        document.getElementById('podiumOverlay').style.display = 'none';
        document.getElementById('countdownOverlay').style.display = 'none';
        document.getElementById('topBar').style.display = 'none';
        document.getElementById('timerDisplay').style.display = 'none';
        canvas.style.display = 'none';
        document.getElementById('lobby').style.display = '';
        document.getElementById('playBar').style.display = '';
        lobbyStep = 0;
        updateLobbyStep();
        syncLobby();
      }

      ws.onopen = () => {
        ws.send(JSON.stringify({ type: 'host-create', hostId: gameId, mode }));
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'room-created') {
          gameId = msg.room;
          localStorage.setItem('racingGameId', gameId);
          gameParams.set('id', gameId);
          history.replaceState(null, '', `${location.pathname}?${gameParams}`);
          document.getElementById('roomCode').textContent = gameId;
          const joinUrl = `${location.protocol}//${location.host}/controller.html?room=${gameId}`;
          new QRCode(document.getElementById('qrcode'), { text: joinUrl, width: 150, height: 150 });
        }
        if (msg.type === 'player-joined') {
          connectedPlayers.add(msg.playerNum);
          syncLobby();
        }
        if (msg.type === 'player-left') {
          connectedPlayers.delete(msg.playerNum);
          syncLobby();
        }
        if (msg.type === 'input') {
          const p = controls[msg.playerNum] || controls[1];
          if (msg.action === 'left') p.left = msg.state === 'down';
          if (msg.action === 'right') p.right = msg.state === 'down';
          if (msg.action === 'up') p.up = msg.state === 'down';
          if (msg.action === 'down') p.down = msg.state === 'down';
          if (msg.action === 'start' && msg.state === 'down') togglePause();
          if (msg.action === 'boost' && msg.state === 'down') { const c = getCarByPlayerNum(msg.playerNum); if (c) tryBoost(c); }
          if (msg.action === 'item' && msg.state === 'down') { const c = getCarByPlayerNum(msg.playerNum); if (c) cycleSelectedItem(c); }
          if (msg.action === 'useItem' && msg.state === 'down') { const c = getCarByPlayerNum(msg.playerNum); if (c) tryUseItem(c); }
        }
      };

      function buildGridPreview() {
        const el = document.getElementById('gridPreview');
        el.innerHTML = '';
        for (let i = 0; i < TOTAL_KARTS; i++) {
          const slot = document.createElement('div');
          const isHuman = i < 2;
          slot.className = 'slot' + (isHuman ? ' human' : '');
          slot.id = `slot${i}`;
          slot.textContent = isHuman ? `P${i + 1}` : 'CPU';
          slot.style.borderColor = PALETTE[i];
          el.appendChild(slot);
        }
      }

      function drawTrackThumb(canvas, polyline) {
        const ctx2 = canvas.getContext('2d');
        const w = canvas.width, h = canvas.height;
        ctx2.clearRect(0, 0, w, h);
        ctx2.strokeStyle = '#7fe8ff';
        ctx2.lineWidth = 2;
        ctx2.beginPath();
        polyline.forEach((p, i) => {
          const px = 4 + p.u * (w - 8), py = 4 + p.v * (h - 8);
          if (i === 0) ctx2.moveTo(px, py); else ctx2.lineTo(px, py);
        });
        ctx2.closePath();
        ctx2.stroke();
      }

      // Cards are plain divs (not <button>s, for the custom layout/thumbnail
      // markup) so they're invisible to keyboard nav by default — this is
      // the whole fix: focusable via Tab, and Enter/Space fires the same
      // click handler already wired up rather than duplicating its logic.
      function makeFocusable(el) {
        el.tabIndex = 0;
        el.setAttribute('role', 'button');
        el.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); el.click(); }
        });
      }

      // Arrow-key equivalent of Tab/Shift+Tab across every focusable lobby
      // control (track cards, condition cards, the play-bar buttons) — full
      // mouse-free navigation without needing real 2D grid math, since
      // Left/Up and Right/Down just walk the same focus order Tab already
      // uses.
      function focusableLobbyEls() {
        return Array.from(document.querySelectorAll('#lobby [tabindex], #lobby button, #playBar button'))
          .filter((el) => el.offsetParent !== null && !el.disabled);
      }
      window.addEventListener('keydown', (e) => {
        if (phase !== 'lobby') return;
        if (!['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) return;
        const els = focusableLobbyEls();
        if (!els.length) return;
        e.preventDefault();
        const cur = els.indexOf(document.activeElement);
        const dir = (e.key === 'ArrowRight' || e.key === 'ArrowDown') ? 1 : -1;
        const next = els[(cur < 0 ? 0 : cur + dir + els.length) % els.length];
        next.focus();
      });

      function buildTrackSelect() {
        const el = document.getElementById('trackSelect');
        el.innerHTML = '';
        Track.LIST.forEach((t) => {
          const card = document.createElement('div');
          card.className = 'track-card' + (t.id === selectedTrackId ? ' selected' : '');
          card.dataset.trackId = t.id;
          const canvas = document.createElement('canvas');
          canvas.className = 'thumb';
          canvas.width = 148; canvas.height = 40;
          card.innerHTML = `<div class="name display-font">${t.name}</div><div class="desc">${t.desc}</div>`;
          card.appendChild(canvas);
          drawTrackThumb(canvas, Track.buildTrack(t.id).polyline);
          makeFocusable(card);
          card.addEventListener('click', () => {
            // Random's build() rolls a new layout on every buildTrack() call
            // (see track.js) — re-drawing its thumbnail here on every click,
            // even repeat clicks, makes that "different every time" visible
            // rather than showing one fixed-looking preview forever. The
            // race itself always gets its own fresh roll at start too.
            if (t.id === 'random') drawTrackThumb(canvas, Track.buildTrack(t.id).polyline);
            selectedTrackId = t.id;
            localStorage.setItem('racingTrackId', selectedTrackId);
            el.querySelectorAll('.track-card').forEach((c) => c.classList.toggle('selected', c.dataset.trackId === t.id));
          });
          el.appendChild(card);
        });
      }
      function buildConditionSelect() {
        const el = document.getElementById('conditionSelect');
        el.innerHTML = '';
        CONDITION_LIST.forEach((cnd) => {
          const card = document.createElement('div');
          card.className = 'track-card' + (cnd.id === selectedConditionId ? ' selected' : '');
          card.dataset.conditionId = cnd.id;
          card.innerHTML = `<div class="name display-font">${cnd.name}</div><div class="desc">${cnd.desc}</div>`;
          makeFocusable(card);
          card.addEventListener('click', () => {
            selectedConditionId = cnd.id;
            localStorage.setItem('racingConditionId', selectedConditionId);
            el.querySelectorAll('.track-card').forEach((c) => c.classList.toggle('selected', c.dataset.conditionId === cnd.id));
          });
          el.appendChild(card);
        });
      }
      function buildDifficultySelect() {
        const el = document.getElementById('difficultySelect');
        el.innerHTML = '';
        DIFFICULTY_LIST.forEach((d) => {
          const card = document.createElement('div');
          card.className = 'track-card' + (d.id === selectedDifficultyId ? ' selected' : '');
          card.dataset.difficultyId = d.id;
          card.innerHTML = `<div class="name display-font">${d.name}</div><div class="desc">${d.desc}</div>`;
          makeFocusable(card);
          card.addEventListener('click', () => {
            selectedDifficultyId = d.id;
            localStorage.setItem('racingDifficultyId', selectedDifficultyId);
            el.querySelectorAll('.track-card').forEach((c) => c.classList.toggle('selected', c.dataset.difficultyId === d.id));
          });
          el.appendChild(card);
        });
      }
      function syncLobby() {
        document.getElementById('players').textContent = connectedPlayers.size
          ? `${connectedPlayers.size} driver${connectedPlayers.size === 1 ? '' : 's'} connected`
          : 'Waiting for driver...';
        document.getElementById('twoBtn').disabled = connectedPlayers.size < 2;
        document.getElementById('aiBtn').disabled = connectedPlayers.size < 1;
        document.getElementById('timerBtn').disabled = connectedPlayers.size < 1;
        for (let i = 0; i < 2; i++) {
          const slot = document.getElementById(`slot${i}`);
          if (slot) slot.classList.toggle('joined', connectedPlayers.has(i + 1));
        }
      }

      // Shows exactly one of the track/conditions/difficulty pickers at a
      // time instead of all three stacked — Back/Next walk between them so
      // picking an option no longer means scrolling past the other two.
      function updateLobbyStep() {
        document.querySelectorAll('.lobby-step').forEach((el) => {
          el.hidden = Number(el.dataset.step) !== lobbyStep;
        });
        document.getElementById('stepBackBtn').disabled = lobbyStep === 0;
        document.getElementById('stepNextBtn').hidden = lobbyStep === LOBBY_STEP_COUNT - 1;
        document.getElementById('stepLabel').textContent = `Step ${lobbyStep + 1} of ${LOBBY_STEP_COUNT}`;
      }
      document.getElementById('stepBackBtn').addEventListener('click', () => {
        lobbyStep = Math.max(0, lobbyStep - 1);
        updateLobbyStep();
      });
      document.getElementById('stepNextBtn').addEventListener('click', () => {
        lobbyStep = Math.min(LOBBY_STEP_COUNT - 1, lobbyStep + 1);
        updateLobbyStep();
      });

      document.getElementById('twoBtn').addEventListener('click', () => startGame('two'));
      document.getElementById('aiBtn').addEventListener('click', () => startGame('ai'));
      document.getElementById('timerBtn').addEventListener('click', () => startGame('timer'));
      document.getElementById('restartBtn').addEventListener('click', () => startGame(mode));
      document.getElementById('menuBtn').addEventListener('click', () => quitToLobby());
      document.getElementById('fullscreenBtn').addEventListener('click', () => {
        document.body.requestFullscreen?.().catch(() => {});
      });
      document.getElementById('resumeBtn').addEventListener('click', () => togglePause());
      document.getElementById('quitBtn').addEventListener('click', () => quitToLobby());
      // Escape pauses (unchanged); a second Escape while already paused
      // quits straight to the lobby instead of needing the mouse — the
      // pause menu's Quit button covers the same action for touch/mouse.
      window.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        if (paused) quitToLobby();
        else togglePause();
      });

      buildGridPreview();
      buildTrackSelect();
      buildConditionSelect();
      buildDifficultySelect();
      updateLobbyStep();
      syncLobby();
    </script>
  </body>
</html>
