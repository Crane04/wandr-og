      function buildSniperModel() {
        const g = new THREE.Group();
        gunPart(
          new THREE.CylinderGeometry(0.022, 0.028, 0.75, 8),
          g,
          0,
          0.03,
          -0.6,
          Math.PI / 2,
          0,
          0,
        ); // barrel
        gunPart(new THREE.BoxGeometry(0.08, 0.09, 0.5), g, 0, 0, -0.1); // receiver
        gunPart(
          new THREE.BoxGeometry(0.055, 0.08, 0.24),
          g,
          0,
          -0.11,
          0.24,
          0.24,
          0,
          0,
        ); // stock
        gunPart(
          new THREE.CylinderGeometry(0.03, 0.03, 0.26, 10),
          g,
          0,
          0.14,
          -0.15,
          0,
          0,
          Math.PI / 2,
        ); // scope tube
        gunPart(
          new THREE.CylinderGeometry(0.038, 0.038, 0.02, 10),
          g,
          0,
          0.14,
          -0.28,
          0,
          0,
          Math.PI / 2,
        ); // scope lens rim
        gunPart(new THREE.BoxGeometry(0.045, 0.18, 0.08), g, 0, -0.14, -0.04); // magazine
        return g;
      }

      function buildKatanaModel() {
        const g = new THREE.Group();
        gunPart(new THREE.BoxGeometry(0.018, 0.018, 0.75), g, 0, 0.02, -0.55); // blade
        gunPart(new THREE.BoxGeometry(0.09, 0.018, 0.018), g, 0, 0.02, -0.16); // guard
        gunPart(
          new THREE.CylinderGeometry(0.018, 0.018, 0.2, 8),
          g,
          0,
          0.02,
          -0.02,
          Math.PI / 2,
          0,
          0,
        ); // hilt
        return g;
      }

      // A simple two-hand rig sells the first-person weapon as something the player is holding.
      function buildPlayerHands() {
        const g = new THREE.Group();
        const handMat = new THREE.MeshBasicMaterial({ color: 0xf7ddc5 });
        for (const [x, y, z, tilt] of [
          [-0.09, -0.18, -0.28, -0.3],
          [0.12, -0.16, 0.12, 0.24],
        ]) {
          const hand = new THREE.Mesh(
            new THREE.SphereGeometry(0.07, 8, 6),
            handMat,
          );
          hand.scale.set(1.05, 1.35, 0.72);
          hand.position.set(x, y, z);
          hand.rotation.z = tilt;
          const edges = new THREE.EdgesGeometry(hand.geometry);
          hand.add(new THREE.LineSegments(edges, gunLineMat));
          g.add(hand);
        }
        return g;
      }

      const GUN_BUILDERS = {
        RIFLE: buildRifleModel,
        SHOTGUN: buildShotgunModel,
        SNIPER: buildSniperModel,
        KATANA: buildKatanaModel,
      };
      const MUZZLE_OFFSET = { RIFLE: -0.87, SHOTGUN: -0.78, SNIPER: -0.99 };

      // invisible marker at the barrel tip, used only as the spawn point for bullets
      const muzzlePoint = new THREE.Object3D();
      gunGroup.add(muzzlePoint);

      let gunModel = null;
      function setGunModel(name) {
        if (gunModel) gunGroup.remove(gunModel);
        gunModel = new THREE.Group();
        gunModel.add(GUN_BUILDERS[name](), buildPlayerHands());
        gunGroup.add(gunModel);
      }

      // ---------- Bullets: real blue projectiles that fly from muzzle to target, shaped per weapon ----------
      const BULLET_SPEC = {
        RIFLE: { color: 0x2255dd, speed: 150, trail: 1.2, size: 0.05 },
        SHOTGUN: { color: 0x2255dd, speed: 110, trail: 0.8, size: 0.035 },
        SNIPER: { color: 0x1133aa, speed: 300, trail: 2.4, size: 0.09 },
        ENEMY: { color: 0xff2626, speed: 145, trail: 2.8, size: 0.085 },
      };
      const bullets = [];
      const muzzleFlashes = [];

      function spawnMuzzleFlash(origin) {
        const flash = new THREE.Mesh(
          new THREE.SphereGeometry(0.18, 7, 5),
          new THREE.MeshBasicMaterial({
            color: 0xffb000,
            transparent: true,
            opacity: 1,
          }),
        );
        flash.position.copy(origin);
        scene.add(flash);
        muzzleFlashes.push({ flash, life: 0.12 });
      }
      function spawnBullet(origin, dir, dist, weaponName) {
        const spec = BULLET_SPEC[weaponName] || BULLET_SPEC.RIFLE;
        const lineMat = new THREE.LineBasicMaterial({
          color: spec.color,
          transparent: true,
          opacity: 0.9,
        });
        const lineGeo = new THREE.BufferGeometry().setFromPoints([
          origin.clone(),
          origin.clone(),
        ]);
        const line = new THREE.Line(lineGeo, lineMat);
        const dot = new THREE.Mesh(
          new THREE.SphereGeometry(spec.size, 6, 5),
          new THREE.MeshBasicMaterial({ color: spec.color }),
        );
        dot.position.copy(origin);
        scene.add(line, dot);
        bullets.push({
          line,
          dot,
          origin: origin.clone(),
          dir: dir.clone(),
          dist,
          speed: spec.speed,
          trail: spec.trail,
          traveled: 0,
        });
        if (weaponName === "ENEMY") spawnMuzzleFlash(origin);
      }
      function updateBullets(dt) {
        for (let i = bullets.length - 1; i >= 0; i--) {
          const b = bullets[i];
          b.traveled += b.speed * dt;
          if (b.traveled >= b.dist + b.trail) {
            scene.remove(b.line, b.dot);
            b.line.geometry.dispose();
            b.line.material.dispose();
            b.dot.geometry.dispose();
            b.dot.material.dispose();
            bullets.splice(i, 1);
            continue;
          }
          const headDist = Math.min(b.traveled, b.dist);
          const tailDist = Math.max(0, headDist - b.trail);
          const head = b.origin.clone().addScaledVector(b.dir, headDist);
          const tail = b.origin.clone().addScaledVector(b.dir, tailDist);
          b.line.geometry.setFromPoints([tail, head]);
          b.dot.position.copy(head);
        }
        for (let i = muzzleFlashes.length - 1; i >= 0; i--) {
          const effect = muzzleFlashes[i];
          effect.life -= dt;
          effect.flash.scale.setScalar(1 + (0.12 - effect.life) * 7);
          effect.flash.material.opacity = Math.max(0, effect.life * 8);
          if (effect.life <= 0) {
            scene.remove(effect.flash);
            effect.flash.geometry.dispose();
            effect.flash.material.dispose();
            muzzleFlashes.splice(i, 1);
          }
        }
      }
      setGunModel(currentWeapon().name);

      let gunRecoil = 0,
        gunBobT = 0;

      // ---------- Grapple hook ----------
      const GRAVITY = 24;
      const GRAPPLE_RANGE = 90;
      const GRAPPLE_REEL_SPEED = 26;
      const grapple = { active: false, anchor: new THREE.Vector3() };
      const vel = new THREE.Vector3(0, 0, 0);
      const grappleLineGeo = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(),
        new THREE.Vector3(),
      ]);
      const grappleLine = new THREE.Line(
        grappleLineGeo,
        new THREE.LineBasicMaterial({ color: 0x2233aa }),
      );
      grappleLine.visible = false;
      scene.add(grappleLine);

      // ---------- Game state ----------
      let running = false;
      let paused = false;
      let yaw = 0,
        pitch = 0;
      const player = { x: 0, y: 0, z: 0 };
      let hp = 120,
        maxHp = 120;
      let healthNotice = 0;
      let playerHitCooldown = 0;
      let reloading = false,
        reloadTimer = 0;
      let score = 0,
        enemiesLeft = 0,
        survivalTime = 0;
      let shootCooldown = 0;
      let aimTargetDist = null;

      let enemies = [];
      let enemyHitMeshes = [];
      let deadEnemies = []; // killed enemies mid fall-over, waiting to despawn
      let spawnTimer = 0;
      const healthPickups = [];
      const healthDrops = []; // one-shot packs left behind by supply-carrier kills

      function buildHealthPackMesh(x, z) {
        const pack = new THREE.Group();
        const caseMat = new THREE.MeshLambertMaterial({ color: 0xf5f2e8 });
        const crossMat = new THREE.MeshBasicMaterial({ color: 0x32ba62 });
        const caseBox = new THREE.Mesh(
          new THREE.BoxGeometry(0.9, 0.58, 0.3),
          caseMat,
        );
        const crossV = new THREE.Mesh(
          new THREE.BoxGeometry(0.15, 0.4, 0.035),
          crossMat,
        );
        const crossH = new THREE.Mesh(
          new THREE.BoxGeometry(0.4, 0.15, 0.035),
          crossMat,
        );
        crossV.position.z = crossH.position.z = 0.17;
        pack.add(caseBox, crossV, crossH);
        pack.position.set(x, 0.65, z);
        scene.add(pack);
        return pack;
      }

      function createHealthPickup(x, z) {
        const pack = buildHealthPackMesh(x, z);
        healthPickups.push({
          pack,
          x,
          z,
          active: true,
          respawn: 0,
          bob: Math.random() * Math.PI * 2,
        });
      }

      // Kept deliberately sparse and placed away from the spawn point, rewarding
      // movement — most healing now comes from hunting down supply-carrier kills instead.
      [
        [-14, 5],
        [12, -18],
        [5, 27],
      ].forEach((p) => createHealthPickup(...p));

      // A kill from a supply-carrier enemy (see releaseEnemy) drops a one-shot pack right
      // where it died, instead of relying only on the sparse fixed world pickups.
      function spawnHealthDrop(x, z) {
        healthDrops.push({
          pack: buildHealthPackMesh(x, z),
          x,
          z,
          life: 14,
          bob: Math.random() * Math.PI * 2,
        });
      }

      function collectHealthPack(x, z) {
        if (Math.hypot(player.x - x, player.z - z) >= 1.55 || hp >= maxHp)
          return false;
        hp = Math.min(maxHp, hp + 35);
        healthNotice = 1.6;
        return true;
      }

      function updateHealthPickups(dt) {
        for (const pickup of healthPickups) {
          if (!pickup.active) {
            pickup.respawn -= dt;
            if (pickup.respawn <= 0) {
              pickup.active = true;
              pickup.pack.visible = true;
            }
            continue;
          }
          pickup.bob += dt * 2;
          pickup.pack.rotation.y += dt * 1.5;
          pickup.pack.position.y = 0.65 + Math.sin(pickup.bob) * 0.12;
          if (collectHealthPack(pickup.x, pickup.z)) {
            pickup.active = false;
            pickup.pack.visible = false;
            pickup.respawn = 28;
          }
        }

        for (let i = healthDrops.length - 1; i >= 0; i--) {
          const drop = healthDrops[i];
          drop.life -= dt;
          drop.bob += dt * 2;
          drop.pack.rotation.y += dt * 1.5;
          drop.pack.position.y = 0.65 + Math.sin(drop.bob) * 0.12;
          const collected = collectHealthPack(drop.x, drop.z);
          if (collected || drop.life <= 0) {
            scene.remove(drop.pack);
            healthDrops.splice(i, 1);
          }
        }

        healthNotice = Math.max(0, healthNotice - dt);
      }

      // enemies engage one at a time, staggered — later spawns wait their turn, but an
      // earlier one that's still alive when its turn comes just adds to a pile-up
      const ENGAGE_STAGGER = 1.05;
      const ENGAGE_STAGGER_CAP = 7.5;
      const ENEMY_ROOF_MAX_HEIGHT = 28;

      function initEnemySpawning() {
        // Enemies arrive continuously, one after another — there is no wave to clear.
        spawnTimer = 1.2;
        enemiesLeft = 0;
        survivalTime = 0;
      }

      function releaseEnemy() {
        const order = { rooftop: Math.random() < 0.34 };
        // Difficulty ramps smoothly with how long the player has survived, instead of in wave jumps.
        const speed =
          (68 + Math.random() * 22 + Math.min(survivalTime, 90) * 0.35) *
          WORLD_SCALE;
        let enemy;
        const playableRoofs = buildingRoofs.filter(
          (roof) => roof.h <= ENEMY_ROOF_MAX_HEIGHT,
        );
        if (order.rooftop && playableRoofs.length) {
          const roof =
            playableRoofs[Math.floor(Math.random() * playableRoofs.length)];
          const rx = THREE.MathUtils.clamp(
            roof.x + (Math.random() - 0.5) * roof.h * 0.16,
            roof.minX + 1,
            roof.maxX - 1,
          );
          const rz = THREE.MathUtils.clamp(
            roof.z + (Math.random() - 0.5) * roof.h * 0.16,
            roof.minZ + 1,
            roof.maxZ - 1,
          );
          enemy = createEnemy(rx, rz, speed);
          enemy.group.position.y = roof.h;
          enemy.roofBuilding = roof;
          // Forced to climb down to street level before doing anything else — see the
          // mustDescend guard in the main update loop, which stops chooseEnemyPlan from
          // overriding this on the very next frame.
          enemy.mustDescend = true;
          enemy.brain = "descend";
          enemy.destination = { x: roof.access.roofX, z: roof.access.roofZ };
        } else {
          // Resample a few times so a spawn ring that happens to cross a building
          // or prop doesn't drop the enemy inside a wall.
          let sx, sz, attempts = 0;
          do {
            const angle = Math.random() * Math.PI * 2;
            const dist = 17 + Math.random() * 10;
            sx = player.x + Math.sin(angle) * dist;
            sz = player.z + Math.cos(angle) * dist;
            attempts++;
          } while (enemyCollidesAt(sx, sz) && attempts < 12);
          enemy = createEnemy(sx, sz, speed);
        }
        // A marked minority of enemies carry a supply pack — their green vest calls
        // them out as worth hunting down, and killing one drops a health pack on the spot.
        enemy.suppliesHealth = Math.random() < 0.12;
        if (enemy.suppliesHealth) {
          enemy.vest.material = enemy.vest.material.clone();
          enemy.vest.material.color.set(0x32ba62);
        }

        // Heavies: a black-clad, tankier, harder-hitting variant. Recoloring the whole
        // body (after the vest tint above) so a heavy supply-carrier still shows its
        // green vest against an otherwise black body.
        enemy.heavy = Math.random() < 0.18;
        if (enemy.heavy) {
          enemy.hp = 420;
          enemy.maxHp = 420;
          enemy.bulletDamage = 12;
          const heavyMat = enemyBodyMat.clone();
          heavyMat.color.set(0x15151a);
          enemy.group.traverse((obj) => {
            if (obj.isMesh && obj.material === enemyBodyMat)
              obj.material = heavyMat;
          });
        }

        enemies.push(enemy);
        enemyHitMeshes.push(enemy.hitMesh, enemy.headHitMesh);
        enemiesLeft++;
        spawnTimer = 3.2 + Math.random() * 1.5;
      }

      const ENEMY_RADIUS = 0.5;
      function collidesAt(x, z) {
        for (const b of buildingColliders) {
          if (
            x > b.minX - PLAYER_RADIUS &&
            x < b.maxX + PLAYER_RADIUS &&
            z > b.minZ - PLAYER_RADIUS &&
            z < b.maxZ + PLAYER_RADIUS
          )
            return true;
        }
        return false;
      }
      function enemyCollidesAt(x, z) {
        for (const b of buildingColliders) {
          if (
            x > b.minX - ENEMY_RADIUS &&
            x < b.maxX + ENEMY_RADIUS &&
            z > b.minZ - ENEMY_RADIUS &&
            z < b.maxZ + ENEMY_RADIUS
          )
            return true;
        }
        return false;
      }

      // true when nothing in buildingMeshes blocks the segment — used so enemies only
      // shoot (and only lose track of you) when they actually have a sightline, which
      // combined with enemyCollidesAt lets them use structures as real cover
      function hasLineOfSight(from, to) {
        const offset = to.clone().sub(from);
        const dist = offset.length();
        if (dist < 0.001) return true;
        raycaster.set(from, offset.multiplyScalar(1 / dist));
        raycaster.far = dist;
        const blocked =
          raycaster.intersectObjects(buildingMeshes, false).length > 0;
        raycaster.far = Infinity;
        return !blocked;
      }

      function killEnemy(en, scored, headshot) {
        if (!en.alive) return;
        en.alive = false;
        playEnemyDeathSound();
        enemyHitMeshes = enemyHitMeshes.filter(
          (m) => m !== en.hitMesh && m !== en.headHitMesh,
        );
        enemiesLeft--;
        if (scored) score += headshot ? 150 : 100;
        if (en.suppliesHealth) {
          spawnHealthDrop(en.group.position.x, en.group.position.z);
        }
        // fall over and lie there for a few seconds instead of vanishing instantly
        en.deathTimer = 3;
        en.fallAxis = Math.random() < 0.5 ? "x" : "z";
        en.fallDir = Math.random() < 0.5 ? 1 : -1;
        en.fallVel = 0; // a body killed on a roof or mid-ladder drops to street level
        deadEnemies.push(en);
      }

      function updateDeadEnemies(dt) {
        for (let i = deadEnemies.length - 1; i >= 0; i--) {
          const en = deadEnemies[i];
          en.deathTimer -= dt;
          const fallProgress = Math.min(1, (3 - en.deathTimer) / 0.35);
          const angle =
            Math.sin((fallProgress * Math.PI) / 2) * (Math.PI / 2) * en.fallDir;
          if (en.fallAxis === "x") en.group.rotation.x = angle;
          else en.group.rotation.z = angle;
          if (en.group.position.y > 0) {
            en.fallVel -= GRAVITY * dt;
            en.group.position.y = Math.max(
              0,
              en.group.position.y + en.fallVel * dt,
            );
          }
          if (en.deathTimer <= 0) {
            scene.remove(en.group);
            deadEnemies.splice(i, 1);
          }
        }
      }

      function nearestEnemyInMeleeCone(range) {
        const forward = new THREE.Vector3(0, 0, -1).applyEuler(
          new THREE.Euler(0, yaw, 0),
        );
        let best = null,
          bestDist = Infinity;
        for (const en of enemies) {
          if (!en.alive) continue;
          const dx = en.group.position.x - player.x;
          const dz = en.group.position.z - player.z;
          const dist = Math.hypot(dx, dz);
          if (dist > range || dist === 0) continue;
          const dot = (dx / dist) * forward.x + (dz / dist) * forward.z;
          if (dot > 0.5 && dist < bestDist) {
            bestDist = dist;
            best = en;
          }
        }
        return best;
      }

      // body shots chip away hp; a headshot is always lethal regardless of weapon
      const BODY_DAMAGE = { RIFLE: 34, SHOTGUN: 18, SNIPER: 110 };

      function fireRaycast(spread, weapon) {
        const dir = new THREE.Vector3(0, 0, -1).applyEuler(
          new THREE.Euler(
            pitch + (Math.random() - 0.5) * spread,
            yaw + (Math.random() - 0.5) * spread,
            0,
            "YXZ",
          ),
        );
        raycaster.far = Infinity;
        raycaster.set(camera.position, dir);
        const hits = raycaster.intersectObjects(
          enemyHitMeshes.concat(shootableCrates),
          false,
        );
        muzzlePoint.position.set(0, 0.04, MUZZLE_OFFSET[weapon.name] || -0.85);
        const muzzleWorld = new THREE.Vector3();
        muzzlePoint.getWorldPosition(muzzleWorld);
        spawnBullet(
          muzzleWorld,
          dir,
          hits.length ? hits[0].distance : 60,
          weapon.name,
        );
        if (hits.length) {
          const hitObj = hits[0].object;
          const enemy = hitObj.userData.enemyRef;
          if (hitObj.userData.crateRef) {
            breakCrate(hitObj.userData.crateRef);
            return;
          }
          if (enemy && enemy.alive) {
            if (hitObj.userData.isHead) {
              killEnemy(enemy, true, true);
            } else {
              enemy.hp -= BODY_DAMAGE[weapon.name] || 25;
              if (enemy.hp <= 0) killEnemy(enemy, true);
            }
          }
        }
      }

      const GUN_KICK = { RIFLE: 0.05, SHOTGUN: 0.15, SNIPER: 0.2, KATANA: 0.1 };
      const AUTO_SPREAD_MAX = 0.045;
      const AUTO_SPREAD_STEP = 0.012;
      let autoSpreadBonus = 0;

      function fire() {
        const weapon = currentWeapon();
        const state = weaponState[weaponIndex];
        shootCooldown = weapon.cooldown;
        gunRecoil = GUN_KICK[weapon.name] || 0.08;

        if (weapon.melee) {
          playSlashSound();
          const enemy = nearestEnemyInMeleeCone(weapon.meleeRange);
          if (enemy) killEnemy(enemy, true);
          return;
        }

        state.ammo--;
        playShotSound(weapon.name);
        const spread = weapon.spread + (weapon.auto ? autoSpreadBonus : 0);
        for (let i = 0; i < weapon.pellets; i++) fireRaycast(spread, weapon);
        if (weapon.auto)
          autoSpreadBonus = Math.min(
            AUTO_SPREAD_MAX,
            autoSpreadBonus + AUTO_SPREAD_STEP,
          );
      }

      function moveEnemyToward(en, target, dt, multiplier = 1) {
        const dx = target.x - en.group.position.x,
          dz = target.z - en.group.position.z;
        const distance = Math.hypot(dx, dz);
        if (distance < 0.12) return true;
        const step = Math.min(distance, en.speed * multiplier * dt);
        const nx = en.group.position.x + (dx / distance) * step;
        const nz = en.group.position.z + (dz / distance) * step;
        // Roof occupants can walk freely over their own roof. Street enemies respect structures.
        if (en.roofBuilding && en.group.position.y > 0.2) {
          en.group.position.x = THREE.MathUtils.clamp(
            nx,
            en.roofBuilding.minX + 0.55,
            en.roofBuilding.maxX - 0.55,
          );
          en.group.position.z = THREE.MathUtils.clamp(
            nz,
            en.roofBuilding.minZ + 0.55,
            en.roofBuilding.maxZ - 0.55,
          );
        } else {
          if (!enemyCollidesAt(nx, en.group.position.z))
            en.group.position.x = nx;
          if (!enemyCollidesAt(en.group.position.x, nz))
            en.group.position.z = nz;
        }
        en.group.rotation.y = Math.atan2(dx, dz);
        return distance < 0.45;
      }

      function chooseEnemyPlan(en, playerPos, canSeePlayer, dist) {
        en.decisionTimer = 1.1 + Math.random() * 1.5;
        if (en.roofBuilding) {
          const roof = en.roofBuilding;
          if (dist < 13 && player.y < 2 && Math.random() < 0.32) {
            en.brain = "descend";
            en.destination = { x: roof.access.roofX, z: roof.access.roofZ };
          } else {
            // On a roof, use the edge as a firing lane and reposition between bursts.
            en.brain = canSeePlayer ? "roofFire" : "roofPatrol";
            const edgeX = THREE.MathUtils.clamp(
              playerPos.x,
              roof.minX + 1,
              roof.maxX - 1,
            );
            const edgeZ = THREE.MathUtils.clamp(
              playerPos.z,
              roof.minZ + 1,
              roof.maxZ - 1,
            );
            en.destination = { x: edgeX, z: edgeZ };
          }
          return;
        }
        if (!canSeePlayer && Math.random() < 0.22) {
          // They use low structures for a tactical angle, never the high tower roofs.
          const lowAccess = buildingAccess.filter(
            (a) => a.h <= ENEMY_ROOF_MAX_HEIGHT,
          );
          const access = lowAccess.reduce(
            (best, a) =>
              !best ||
              Math.hypot(a.x - en.group.position.x, a.z - en.group.position.z) <
                Math.hypot(
                  best.x - en.group.position.x,
                  best.z - en.group.position.z,
                )
                ? a
                : best,
            null,
          );
          if (access) {
            en.brain = "climb";
            en.destination = access;
            return;
          }
        }
        if (canSeePlayer && dist < 18) {
          en.brain = "cover";
          const sideX =
            (-(playerPos.z - en.group.position.z) / Math.max(dist, 1)) *
            en.flankSign;
          const sideZ =
            ((playerPos.x - en.group.position.x) / Math.max(dist, 1)) *
            en.flankSign;
          en.destination = {
            x: en.group.position.x + sideX * 4,
            z: en.group.position.z + sideZ * 4,
          };
        } else {
          en.brain = "flank";
          const sideX =
            (-(playerPos.z - en.group.position.z) / Math.max(dist, 1)) *
            en.flankSign;
          const sideZ =
            ((playerPos.x - en.group.position.x) / Math.max(dist, 1)) *
            en.flankSign;
          en.destination = {
            x: playerPos.x + sideX * 5,
            z: playerPos.z + sideZ * 5,
          };
        }
      }

      function update(dt) {
        // Phone browsers can occasionally lose a touch-end event. The controller sends
        // a 30Hz heartbeat, so a short silence is safe evidence to release all controls.
        if (Date.now() - input.lastReceived > 450) resetInputState();
        updateHealthPickups(dt);
        playerHitCooldown = Math.max(0, playerHitCooldown - dt);

        // look
        const lookSensitivity = 0.0035;
        yaw -= input.look.dx * lookSensitivity;
        pitch -= input.look.dy * lookSensitivity;
        input.look.dx = 0;
        input.look.dy = 0;

        // movement (grounded only — mid-grapple/airborne, the grapple/gravity velocity below takes over)
        const grounded = player.y <= 0.001 && !grapple.active;
        const moveRight = Math.abs(input.move.x) > 0.08 ? input.move.x : 0;
        const stickY = Math.abs(input.move.y) > 0.08 ? input.move.y : 0;

        // Hold × to plant your feet. The entire stick then directs the gun instead of movement.
        const PITCH_STICK_SPEED = 1.6;
        if (input.aim) {
          yaw -= moveRight * PITCH_STICK_SPEED * dt;
          pitch -= stickY * PITCH_STICK_SPEED * dt;
        }
        pitch = Math.max(-1.1, Math.min(1.1, pitch));

        const moveForward = input.aim ? 0 : -stickY;
        if (grounded && !input.aim && (moveRight || moveForward)) {
          const forward = new THREE.Vector3(0, 0, -1).applyEuler(
            new THREE.Euler(0, yaw, 0),
          );
          const right = new THREE.Vector3(1, 0, 0).applyEuler(
            new THREE.Euler(0, yaw, 0),
          );
          const speed = 9;
          const nx =
            player.x +
            (right.x * moveRight + forward.x * moveForward) * speed * dt;
          const nz =
            player.z +
            (right.z * moveRight + forward.z * moveForward) * speed * dt;
          if (!collidesAt(nx, player.z)) player.x = nx;
          if (!collidesAt(player.x, nz)) player.z = nz;
        }

        // grapple hook
        if (input.grapple && !grapple.active) {
          raycaster.setFromCamera({ x: 0, y: 0 }, camera);
          const hits = raycaster.intersectObjects(buildingMeshes, false);
          if (hits.length && hits[0].distance <= GRAPPLE_RANGE) {
            grapple.active = true;
            grapple.anchor.copy(hits[0].point);
          }
        }
        if (!input.grapple) grapple.active = false;

        if (grapple.active) {
          const toAnchor = grapple.anchor
            .clone()
            .sub(new THREE.Vector3(player.x, player.y, player.z));
          const dist = toAnchor.length();
          if (dist > 2) {
            toAnchor.normalize();
            vel.copy(toAnchor).multiplyScalar(GRAPPLE_REEL_SPEED);
          } else {
            grapple.active = false;
          }
        }

        // gravity + velocity integration (grapple momentum carries over after release)
        if (!grapple.active) vel.y -= GRAVITY * dt;
        if (grapple.active || player.y > 0 || vel.lengthSq() > 0) {
          player.x += vel.x * dt;
          player.y += vel.y * dt;
          player.z += vel.z * dt;
          if (player.y <= 0) {
            player.y = 0;
            vel.set(0, 0, 0);
          }
        }

        grappleLine.visible = grapple.active;
        if (grapple.active) {
          const origin = new THREE.Vector3(
            player.x,
            player.y + EYE_HEIGHT - 0.3,
            player.z,
          );
          grappleLine.geometry.setFromPoints([origin, grapple.anchor]);
        }

        camera.position.set(player.x, player.y + EYE_HEIGHT, player.z);
        camera.rotation.set(pitch, yaw, 0);
        camera.updateMatrixWorld();

        // what's under the crosshair right now (drives the red target box)
        raycaster.setFromCamera({ x: 0, y: 0 }, camera);
        const aimHits = raycaster.intersectObjects(enemyHitMeshes, false);
        aimTargetDist = aimHits.length ? aimHits[0].distance : null;

        // weapon switching
        if (input.weaponPressed) {
          cycleWeapon();
          input.weaponPressed = false;
        }

        // reload
        const weapon = currentWeapon();
        const wstate = weaponState[weaponIndex];
        // No clip/reserve split — just bullets. Once the count finishes, it reloads
        // back up to a full maxAmmo (this also fires automatically on empty, so the
        // reload button is optional rather than required).
        if (!reloading && !weapon.melee && wstate.ammo <= 0) {
          reloading = true;
          reloadTimer = weapon.reloadTime;
        }
        input.reloadPressed = false;
        if (reloading) {
          reloadTimer -= dt;
          if (reloadTimer <= 0) {
            reloading = false;
            wstate.ammo = weapon.maxAmmo;
          }
        }

        if (shootCooldown > 0) shootCooldown -= dt;
        updateBullets(dt);

        // Holding the shoot button keeps firing every weapon at its own cooldown pace —
        // no need to release and re-press between shots, even on the "semi-auto" guns.
        const canFire = weapon.melee
          ? !reloading
          : !reloading && wstate.ammo > 0;
        if (input.shoot && canFire && shootCooldown <= 0) {
          fire();
        }
        if (!input.shoot)
          autoSpreadBonus = Math.max(0, autoSpreadBonus - dt * 0.2);

        // Enemies arrive as small squads, giving each encounter readable pacing.
        spawnTimer -= dt;
        if (spawnTimer <= 0) releaseEnemy();

        // Enemies navigate, use cover, and travel between street and rooftops via ladders.
        const PLAYER_REACH_HEIGHT = 3;
        const ENEMY_SHOOT_RANGE = 24;
        for (const en of enemies) {
          if (!en.alive) continue;
          const dx = player.x - en.group.position.x;
          const dz = player.z - en.group.position.z;
          const dist = Math.hypot(dx, dz);
          let moving = false;
          const eyePos = new THREE.Vector3(
            en.group.position.x,
            en.group.position.y + 1.9,
            en.group.position.z,
          );
          const playerPos = new THREE.Vector3(
            player.x,
            player.y + EYE_HEIGHT,
            player.z,
          );
          const canSeePlayer =
            dist <= ENEMY_SHOOT_RANGE && hasLineOfSight(eyePos, playerPos);

          if (
            dist <= MELEE_RADIUS &&
            player.y < PLAYER_REACH_HEIGHT &&
            !en.roofBuilding
          ) {
            killEnemy(en, false);
            hp -= 12;
            if (hp <= 0) {
              hp = 0;
              endGame(false);
            }
          } else if (en.climbing) {
            const access = en.climbing;
            const direction = en.climbingUp ? 1 : -1;
            en.group.position.y += direction * 4.5 * dt;
            // The ladder runs from the street-side rung (bottom) to the roof-side ledge
            // (top) — interpolate across it instead of pinning to one side the whole
            // climb, which used to leave descending enemies standing inside the wall
            // once they reached the ground (roofX/roofZ sit inside the footprint).
            const climbT = THREE.MathUtils.clamp(
              en.group.position.y / access.h,
              0,
              1,
            );
            en.group.position.x = THREE.MathUtils.lerp(
              access.x,
              access.roofX,
              climbT,
            );
            en.group.position.z = THREE.MathUtils.lerp(
              access.z,
              access.roofZ,
              climbT,
            );
            en.group.rotation.y = Math.PI / 2;
            moving = true;
            // Landing (either direction) clears the brain that drove the climb — otherwise a
            // stale 'descend'/'climb' brain can outlive the roofBuilding/destination it was
            // paired with and read .access off whatever is null on the next frame.
            if (en.climbingUp && en.group.position.y >= access.h) {
              en.group.position.y = access.h;
              en.roofBuilding =
                buildingRoofs.find((r) => r.access === access) || null;
              en.climbing = null;
              en.brain = "advance";
              en.destination = null;
              en.decisionTimer = 0;
            } else if (!en.climbingUp && en.group.position.y <= 0) {
              en.group.position.y = 0;
              en.roofBuilding = null;
              en.climbing = null;
              en.brain = "advance";
              en.destination = null;
              en.decisionTimer = 0;
            }
          } else {
            en.decisionTimer -= dt;
            // A freshly-spawned rooftop enemy must reach the ladder and climb down before
            // chooseEnemyPlan gets a say — otherwise it overrides the forced descent on the
            // very next frame (decisionTimer starts at 0) and the enemy never comes down.
            if (!en.mustDescend && (en.decisionTimer <= 0 || !en.destination))
              chooseEnemyPlan(en, playerPos, canSeePlayer, dist);

            if (
              en.brain === "climb" &&
              moveEnemyToward(en, en.destination, dt)
            ) {
              en.climbing = en.destination;
              en.climbingUp = true;
            } else if (
              en.brain === "descend" &&
              en.roofBuilding &&
              moveEnemyToward(en, en.destination, dt)
            ) {
              en.climbing = en.roofBuilding.access;
              en.climbingUp = false;
              en.mustDescend = false;
            } else if (en.destination && en.brain !== "roofFire") {
              moveEnemyToward(
                en,
                en.destination,
                dt,
                en.brain === "cover" ? 0.75 : 1,
              );
              moving = true;
            }

            if (
              canSeePlayer &&
              (en.brain === "roofFire" || en.brain === "cover" || dist < 12)
            ) {
              en.group.rotation.y = Math.atan2(dx, dz);
              en.gun.rotation.x = Math.atan2(
                playerPos.y - (en.group.position.y + 1.98),
                Math.max(dist, 0.1),
              );
              en.shootCooldown -= dt;
              if (en.shootCooldown <= 0) {
                const muzzleWorld = new THREE.Vector3();
                en.gunMuzzle.getWorldPosition(muzzleWorld);
                // Enemies lead poorly and become less accurate with range; their visible tracer
                // follows the same imperfect shot instead of implying unavoidable hits.
                const hitChance = dist < 8 ? 0.54 : dist < 16 ? 0.39 : 0.25;
                const hitsPlayer = Math.random() < hitChance;
                const aimPoint = playerPos.clone();
                if (!hitsPlayer) {
                  aimPoint.x += (Math.random() - 0.5) * (2.2 + dist * 0.1);
                  aimPoint.y += (Math.random() - 0.5) * 1.4;
                  aimPoint.z += (Math.random() - 0.5) * (2.2 + dist * 0.1);
                }
                const dir = aimPoint.sub(muzzleWorld).normalize();
                spawnBullet(
                  muzzleWorld,
                  dir,
                  muzzleWorld.distanceTo(playerPos),
                  "ENEMY",
                );
                en.gunRecoil = 1;
                if (hitsPlayer && playerHitCooldown <= 0) {
                  hp -= en.bulletDamage;
                  playerHitCooldown = 0.42;
                  if (hp <= 0) {
                    hp = 0;
                    endGame(false);
                  }
                }
                en.shootCooldown = 2.05 + Math.random() * 1.25;
              }
            }
          }

          if (en.alive) {
            if (moving) en.walkT += dt * 9;
            // Keep both hands on the rifle; only a subtle shoulder motion remains while walking.
            const armSway = Math.sin(en.walkT) * (moving ? 0.12 : 0);
            const legSwing = Math.sin(en.walkT) * (moving ? 0.7 : 0);
            en.limbs.leftArmPivot.rotation.x = -0.78 + armSway;
            en.limbs.rightArmPivot.rotation.x = -0.92 - armSway;
            // The shoulders sit 0.48 out to each side, but the rifle is held on the
            // centerline — without an inward cant here the forearms swing straight down
            // past the sides of the gun instead of actually reaching it.
            en.limbs.leftArmPivot.rotation.z = 0.5;
            en.limbs.rightArmPivot.rotation.z = -0.5;
            en.limbs.leftLegPivot.rotation.x = -legSwing;
            en.limbs.rightLegPivot.rotation.x = legSwing;
            const torsoBob = Math.abs(Math.cos(en.walkT)) * (moving ? 0.05 : 0);
            en.torso.position.y = 1.55 + torsoBob;

            // The rifle rides the torso's bob and settles out of its firing kick each
            // frame, instead of hanging frozen in the air independent of the body.
            en.gunRecoil = Math.max(0, en.gunRecoil - dt * 8);
            en.gun.position.y = 1.92 + torsoBob;
            en.gun.position.z = 0.25 - en.gunRecoil * 0.1;
          }
        }
        updateDeadEnemies(dt);
        survivalTime += dt;

        // gun viewmodel: idle sway + walk bob + recoil kick, then decay recoil
        gunRecoil = Math.max(0, gunRecoil - dt * 5);
        const gunMoving = grounded && !input.aim && (moveRight || moveForward);
        gunBobT += dt * (gunMoving ? 9 : 1.6);
        const bobAmt = gunMoving ? 1 : 0.25;
        const bobX = Math.sin(gunBobT) * 0.012 * bobAmt;
        const bobY = Math.abs(Math.sin(gunBobT * 2)) * 0.01 * bobAmt;
        gunGroup.position.set(
          GUN_REST.x + bobX,
          GUN_REST.y + bobY + gunRecoil * 0.35,
          GUN_REST.z + gunRecoil,
        );
        gunGroup.rotation.set(-gunRecoil * 1.6, -0.05, 0);
      }

      // ---------- HUD overlay (screen-space ink drawing) ----------
      // The gun itself is now a real 3D viewmodel (see "Gun viewmodel" section) rendered by
      // the WebGL layer; this canvas only draws the 2D crosshair + text HUD on top of it.
      function drawHUD() {
        ctx.font = hudFont(22);
        glowText(`SCORE ${score}`, 20, 128, HUD_ACCENT, 10);
        ctx.font = hudFont(16, "600");
        ctx.fillStyle = INK;
        ctx.fillText(`${enemiesLeft} enemies`, W - 160, 40);

        // Large, high-contrast life meter: always visible in the top-left
        // corner. Dark tactical readout instead of the old cream card, so
        // it reads as a HUD overlay rather than a paper doodle — the 3D
        // world's own comic-book art style behind it is untouched.
        ctx.fillStyle = HUD_DARK;
        ctx.fillRect(16, 16, 274, 96);
        ctx.strokeStyle = HUD_ACCENT;
        ctx.lineWidth = 2;
        ctx.strokeRect(18, 18, 270, 92);
        ctx.font = hudFont(19);
        glowText("LIFE", 30, 47, HUD_ACCENT, 6);
        ctx.font = hudFont(28);
        const critical = hp <= maxHp * 0.3;
        glowText(
          `${Math.ceil(hp)} / ${maxHp}`,
          104,
          48,
          critical ? HUD_DANGER : "#fff",
          critical ? 16 : 4,
        );
        ctx.strokeStyle = "rgba(255,255,255,.25)";
        ctx.lineWidth = 2;
        ctx.strokeRect(30, 66, 238, 25);
        ctx.fillStyle = HUD_DANGER;
        ctx.fillRect(33, 69, 232 * Math.max(0, hp / maxHp), 19);
        if (healthNotice > 0) {
          ctx.font = hudFont(18);
          glowText("HEALTH +35", 30, 106, "#4dff8a", 8);
        }

        // weapon + ammo — one bullet count per weapon, no clip/reserve split.
        const weapon = currentWeapon();
        const wstate = weaponState[weaponIndex];
        ctx.font = hudFont(20);
        const ammoText = weapon.melee
          ? "READY"
          : reloading
            ? "RELOADING..."
            : `${wstate.ammo}/${weapon.maxAmmo}`;
        glowText(ammoText, 20, H - 34, reloading ? HUD_DANGER : HUD_ACCENT, 8);
        ctx.font = hudFont(13, "600");
        ctx.fillStyle = INK;
        ctx.fillText(weapon.name, 20, H - 54);
      }

      // bracket-corner target box — appears over the crosshair whenever there's a
      // hittable enemy directly under it, so the player knows they can shoot
      function drawTargetBox(cx, cy, size) {
        const half = size / 2,
          arm = size * 0.32;
        const corners = [
          [-half, -half, 1, 0],
          [half, -half, -1, 0],
          [-half, half, 1, 0],
          [half, half, -1, 0],
        ];
        for (const [ox, oy, hdx] of corners) {
          const x = cx + ox,
            y = cy + oy;
          const vdy = oy < 0 ? 1 : -1;
          sketchLineColor(x, y, x + hdx * arm, y, "#cc3333", 1, 0.8);
          sketchLineColor(x, y, x, y + vdy * arm, "#cc3333", 1, 0.8);
        }
      }

      // A small floating bar over each visible enemy's head, draining from 100% to 0%
      // as it takes damage — a quick read on how much more it can soak up before dying.
      const healthBarProj = new THREE.Vector3();
      function drawEnemyHealthBars() {
        for (const en of enemies) {
          if (!en.alive) continue;
          const frac = Math.max(0, Math.min(1, en.hp / en.maxHp));
          healthBarProj.set(
            en.group.position.x,
            en.group.position.y + 3.05,
            en.group.position.z,
          );
          healthBarProj.project(camera);
          if (
            healthBarProj.z > 1 ||
            Math.abs(healthBarProj.x) > 1 ||
            Math.abs(healthBarProj.y) > 1
          )
            continue;
          const dist = camera.position.distanceTo(en.group.position);
          const sx = (healthBarProj.x * 0.5 + 0.5) * W;
          const sy = (1 - (healthBarProj.y * 0.5 + 0.5)) * H;
          const barW = Math.max(20, Math.min(56, 850 / dist));
          const barH = 5;
          ctx.fillStyle = "rgba(20,20,20,0.6)";
          ctx.fillRect(sx - barW / 2 - 1, sy - barH / 2 - 1, barW + 2, barH + 2);
          ctx.fillStyle =
            frac > 0.5 ? "#4ee37a" : frac > 0.2 ? "#f2c14e" : "#e0453f";
          ctx.fillRect(sx - barW / 2, sy - barH / 2, barW * frac, barH);
        }
      }

      // off-screen red arrows pointing toward nearby enemies that aren't in view,
      // so the player isn't left hunting around the map for them
      const ENEMY_INDICATOR_RANGE = 55;
      const arrowFwd = new THREE.Vector3();
      const arrowRight = new THREE.Vector3();
      const arrowProj = new THREE.Vector3();
      function drawEnemyArrows() {
        if (!enemies.length) return;
        const cx = W / 2,
          cy = H / 2;
        const R = Math.min(W, H) * 0.42;
        arrowFwd.set(0, 0, -1).applyEuler(new THREE.Euler(0, yaw, 0));
        arrowRight.set(1, 0, 0).applyEuler(new THREE.Euler(0, yaw, 0));

        for (const en of enemies) {
          if (!en.alive) continue;
          const dx = en.group.position.x - player.x;
          const dz = en.group.position.z - player.z;
          const dist = Math.hypot(dx, dz);
          if (dist > ENEMY_INDICATOR_RANGE || dist < 0.001) continue;

          arrowProj.set(
            en.group.position.x,
            en.group.position.y + 1.6,
            en.group.position.z,
          );
          arrowProj.project(camera);
          const onScreen =
            arrowProj.z < 1 &&
            Math.abs(arrowProj.x) < 0.92 &&
            Math.abs(arrowProj.y) < 0.92;
          if (onScreen) continue;

          const ndx = dx / dist,
            ndz = dz / dist;
          const relX = ndx * arrowRight.x + ndz * arrowRight.z;
          const relZ = ndx * arrowFwd.x + ndz * arrowFwd.z;
          const angle = Math.atan2(relX, relZ);

          const px = cx + Math.sin(angle) * R;
          const py = cy - Math.cos(angle) * R;
          const alpha = 0.35 + (1 - dist / ENEMY_INDICATOR_RANGE) * 0.55;
          const arrowColor = en.heavy ? "21,21,26" : "204,51,51";

          const len = 15,
            wid = 8;
          const tip = {
            x: px + Math.sin(angle) * len,
            y: py - Math.cos(angle) * len,
          };
          const baseL = {
            x: px + Math.sin(angle - 2.6) * wid,
            y: py - Math.cos(angle - 2.6) * wid,
          };
          const baseR = {
            x: px + Math.sin(angle + 2.6) * wid,
            y: py - Math.cos(angle + 2.6) * wid,
          };
          sketchLineColor(
            tip.x,
            tip.y,
            baseL.x,
            baseL.y,
            `rgba(${arrowColor},${alpha})`,
            1,
            1,
          );
          sketchLineColor(
            tip.x,
            tip.y,
            baseR.x,
            baseR.y,
            `rgba(${arrowColor},${alpha})`,
            1,
            1,
          );
        }
      }

      function drawMinimap() {
        const size = Math.min(200, Math.max(150, Math.min(W, H) * 0.24));
        const pad = 22,
          left = W - size - pad,
          top = H - size - pad;
        const extent = 82; // Covers the complete playable city block in one glance.
        const toMap = (x, z) => ({
          x: left + ((x + extent) / (extent * 2)) * size,
          y: top + ((z + extent) / (extent * 2)) * size,
        });

        ctx.fillStyle = "rgba(16, 35, 52, 0.9)";
        ctx.fillRect(left, top, size, size);
        ctx.strokeStyle = "#eaf5ff";
        ctx.lineWidth = 2;
        ctx.strokeRect(left, top, size, size);
        ctx.strokeStyle = "rgba(150, 194, 219, 0.22)";
        ctx.lineWidth = 1;
        for (let step = -60; step <= 60; step += 30) {
          const a = toMap(step, -extent),
            b = toMap(step, extent),
            c = toMap(-extent, step),
            d = toMap(extent, step);
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.moveTo(c.x, c.y);
          ctx.lineTo(d.x, d.y);
          ctx.stroke();
        }

        // Structures are laid out as their actual top-down footprints.
        ctx.fillStyle = "#8294a3";
        for (const b of buildingColliders) {
          const a = toMap(b.minX, b.minZ),
            c = toMap(b.maxX, b.maxZ);
          ctx.fillRect(a.x, a.y, c.x - a.x, c.y - a.y);
        }
        for (const pickup of healthPickups) {
          if (!pickup.active) continue;
          const p = toMap(pickup.x, pickup.z);
          ctx.fillStyle = "#4ee37a";
          ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
        }
        for (const drop of healthDrops) {
          const p = toMap(drop.x, drop.z);
          ctx.fillStyle = "#4ee37a";
          ctx.fillRect(p.x - 3, p.y - 3, 6, 6);
        }
        for (const en of enemies) {
          if (!en.alive) continue;
          const p = toMap(en.group.position.x, en.group.position.z);
          ctx.fillStyle = en.heavy ? "#15151a" : "#ff5454";
          ctx.beginPath();
          ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
          ctx.fill();
        }

        const you = toMap(player.x, player.z);
        ctx.save();
        ctx.translate(you.x, you.y);
        ctx.rotate(yaw);
        ctx.fillStyle = "#59c9ff";
        ctx.beginPath();
        ctx.moveTo(0, -7);
        ctx.lineTo(5, 6);
        ctx.lineTo(-5, 6);
        ctx.closePath();
        ctx.fill();
        ctx.restore();
        ctx.fillStyle = "#eaf5ff";
        ctx.font = "bold 11px monospace";
        ctx.fillText("TACTICAL MAP", left + 8, top + 15);
        ctx.fillText(`ENEMIES: ${enemiesLeft}`, left + 8, top + size - 8);
      }

      function drawOverlay() {
        ctx.clearRect(0, 0, W, H);

        const cx = W / 2,
          cy = H / 2;
        sketchLine(cx - 14, cy, cx - 4, cy, 1, 0.6);
        sketchLine(cx + 4, cy, cx + 14, cy, 1, 0.6);
        sketchLine(cx, cy - 14, cx, cy - 4, 1, 0.6);
        sketchLine(cx, cy + 4, cx, cy + 14, 1, 0.6);
        if (aimTargetDist != null) {
          drawTargetBox(
            cx,
            cy,
            Math.max(16, Math.min(50, 260 / aimTargetDist)),
          );
        } else {
          sketchCircle(cx, cy, 18, 1);
        }

        drawEnemyHealthBars();
        drawEnemyArrows();
        drawMinimap();
        drawHUD();
      }

      function drawPausedOverlay() {
        // Dark ember gradient instead of the old cream wash, matching the
        // lobby/game-over screens — the one moment gameplay fully stops is
        // exactly when the dramatic theme should take over the whole frame.
        const grad = ctx.createRadialGradient(
          W / 2,
          H / 2,
          0,
          W / 2,
          H / 2,
          Math.max(W, H) * 0.7,
        );
        grad.addColorStop(0, "rgba(60,14,12,0.88)");
        grad.addColorStop(1, "rgba(6,3,2,0.94)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
        ctx.textAlign = "center";
        ctx.font = hudFont(52);
        glowText("PAUSED", W / 2, H / 2 - 10, HUD_ACCENT, 30);
        ctx.font = hudFont(18, "600");
        ctx.fillStyle = "#f3e9df";
        ctx.fillText("Press START to resume", W / 2, H / 2 + 30);
        ctx.textAlign = "left";
      }

      function endGame(won) {
        running = false;
        document.getElementById("finalMsg").textContent = won
          ? `You win! Score: ${score}`
          : `You went down. Score: ${score}`;
        document.getElementById("gameOverOverlay").style.display = "flex";
      }

      let lastTime = Date.now();
      function loop() {
        if (!running) return;
        const now = Date.now();
        const dt = Math.min(0.05, (now - lastTime) / 1000);
        lastTime = now;

        if (input.startPresses > 0) {
          input.startPresses--;
          paused = !paused;
        }

        if (!paused) update(dt);
        renderer.render(scene, camera);
        drawOverlay();
        if (paused) drawPausedOverlay();
        requestAnimationFrame(loop);
      }

      document.getElementById("startBtn").addEventListener("click", () => {
        ensureAudio(); // unlock audio on this user gesture, before any shot needs to play
        document.getElementById("lobby").style.display = "none";
        gameWrap.style.display = "block";
        resizeGame();
        weaponIndex = 0;
        weaponState = WEAPONS.map((w) => ({ ammo: w.maxAmmo }));
        initEnemySpawning();
        paused = false;
        running = true;
        lastTime = Date.now();
        loop();
      });
    </script>
  </body>
</html>
