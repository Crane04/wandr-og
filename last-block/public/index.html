<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Last Block</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
      /* Self-hosted — not on Google Fonts. Licensed personal-use-only
         (1001Fonts Free For Personal Use License); used here on the
         explicit understanding that's acceptable for this project. */
      @font-face {
        font-family: "Namistre";
        src: url("fonts/Namistre.ttf") format("truetype");
        font-display: swap;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background:
          radial-gradient(ellipse 70% 50% at 50% 0%, rgba(255, 90, 40, 0.14), transparent 65%),
          radial-gradient(circle at 50% 100%, #2a1210 0%, #140807 55%, #060302 100%);
        color: #f3e9df;
        font-family: "Rajdhani", "Trebuchet MS", "Courier New", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
        position: relative;
        overflow-x: hidden;
      }
      /* Faint scanlines behind the lobby card — cheap way to read as a HUD
         readout rather than a plain web form, without loading any image
         assets. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          rgba(255, 255, 255, 0.02) 0px,
          rgba(255, 255, 255, 0.02) 1px,
          transparent 1px,
          transparent 3px
        );
        pointer-events: none;
      }
      #lobby {
        width: min(92vw, 430px);
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 14px;
        padding: 38px 28px 30px;
        position: relative;
        background: linear-gradient(180deg, rgba(35, 14, 12, 0.8), rgba(14, 6, 5, 0.88));
        border: 1px solid rgba(255, 120, 60, 0.25);
        box-shadow: 0 0 70px rgba(255, 70, 20, 0.16), inset 0 0 50px rgba(0, 0, 0, 0.5);
      }
      /* Corner brackets, like a targeting reticle framing the card. */
      #lobby::before,
      #lobby::after {
        content: "";
        position: absolute;
        width: 22px;
        height: 22px;
        border-style: solid;
        border-color: #ff6a3d;
        border-width: 0;
      }
      #lobby::before {
        top: -1px;
        left: -1px;
        border-top-width: 3px;
        border-left-width: 3px;
      }
      #lobby::after {
        bottom: -1px;
        right: -1px;
        border-bottom-width: 3px;
        border-right-width: 3px;
      }
      #lobby h1 {
        width: 100%;
        font-family: "Namistre", "Bebas Neue", sans-serif;
        font-size: clamp(42px, 11vw, 62px);
        line-height: 1;
        letter-spacing: 4px;
        margin: 0;
        color: #fff;
        text-shadow:
          0 0 18px rgba(255, 90, 30, 0.85),
          0 0 42px rgba(255, 40, 10, 0.45),
          2px 2px 0 #000;
      }
      #lobby p {
        width: 100%;
        color: #dcb8a6;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.45;
        margin: 0;
      }
      #roomCode {
        width: 100%;
        font-family: "Namistre", "Bebas Neue", monospace;
        font-size: clamp(38px, 10vw, 50px);
        line-height: 1;
        letter-spacing: 10px;
        color: #ffb347;
        text-shadow: 0 0 14px rgba(255, 150, 50, 0.7);
        margin: 4px 0 0 10px;
      }
      #qrcode {
        background: #fff;
        padding: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2px;
        border: 3px solid #ff6a3d;
        box-shadow: 0 0 20px rgba(255, 90, 30, 0.35);
        line-height: 0;
      }
      #playerStatus {
        width: 100%;
        min-height: 36px;
        margin: 0;
        padding: 8px 12px;
        border-radius: 2px;
        background: rgba(130, 25, 20, 0.4);
        border: 1px solid rgba(255, 90, 40, 0.4);
        color: #ffcdb8;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        font-size: 13px;
        animation: pulseWarn 1.6s ease-in-out infinite;
      }
      @keyframes pulseWarn {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.55;
        }
      }
      #playerStatus.ready {
        background: rgba(30, 120, 55, 0.35);
        border-color: rgba(90, 255, 140, 0.5);
        color: #c8ffd8;
        animation: none;
      }
      #startBtn {
        width: 100%;
        margin: 4px 0 0;
        padding: 15px 28px;
        font-family: "Namistre", "Bebas Neue", sans-serif;
        font-size: 24px;
        letter-spacing: 3px;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ff7a3d, #d92e1e);
        color: #fff;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        box-shadow: 0 4px 0 #8a1a10, 0 0 26px rgba(255, 80, 30, 0.5);
        transition: transform 0.1s, box-shadow 0.1s;
      }
      #startBtn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 #8a1a10, 0 0 26px rgba(255, 80, 30, 0.5);
      }
      #startBtn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
        box-shadow: none;
      }
      #gameWrap {
        display: none;
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        z-index: 20;
      }
      #gameWrap canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #webgl {
        background: #f4f1e8;
      }
      #game {
        background: transparent;
      }
      #gameOverOverlay {
        display: none;
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, rgba(70, 14, 12, 0.97), rgba(6, 3, 2, 0.99));
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        z-index: 30;
        color: #ff6a4a;
      }
      #gameOverOverlay h2 {
        font-family: "Namistre", "Bebas Neue", sans-serif;
        font-size: 58px;
        letter-spacing: 3px;
        text-shadow: 0 0 26px rgba(255, 60, 30, 0.7);
      }
      #gameOverOverlay button {
        padding: 13px 30px;
        font-family: "Namistre", "Bebas Neue", sans-serif;
        font-size: 20px;
        letter-spacing: 2px;
        text-transform: uppercase;
        background: linear-gradient(180deg, #ff7a3d, #d92e1e);
        color: #fff;
        border: none;
        border-radius: 2px;
        cursor: pointer;
        box-shadow: 0 4px 0 #8a1a10;
      }
    </style>
  </head>
  <body>
    <div id="lobby">
      <h1>Last Block</h1>
      <p>Scan with your phone to become the gunner — grapple, gear up, and hold the line against endless waves of enemies.</p>
      <div id="roomCode">----</div>
      <div id="qrcode"></div>
      <div id="playerStatus">Waiting for player...</div>
      <button id="startBtn" disabled>Deploy</button>
    </div>

    <div id="gameWrap">
      <canvas id="webgl"></canvas>
      <canvas id="game"></canvas>
    </div>

    <div id="gameOverOverlay">
      <h2 id="finalMsg"></h2>
      <button onclick="location.reload()">Play Again</button>
    </div>

    <script>
      const wsProtocol = location.protocol === "https:" ? "wss:" : "ws:";
      const ws = new WebSocket(`${wsProtocol}//${location.host}`);
      let roomCode = null;
      let playerConnected = false;

      const gameParams = new URLSearchParams(location.search);
      const requestedId = (
        gameParams.get("id") ||
        localStorage.getItem("lastBlockGameId") ||
        ""
      ).toUpperCase();
      let gameId = /^[A-Z2-9]{4}$/.test(requestedId) ? requestedId : null;

      ws.onopen = () =>
        ws.send(JSON.stringify({ type: "host-create", hostId: gameId }));

      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === "room-created") {
          roomCode = msg.room;
          gameId = msg.room;
          localStorage.setItem("lastBlockGameId", gameId);
          gameParams.set("id", gameId);
          history.replaceState(null, "", `${location.pathname}?${gameParams}`);
          document.getElementById("roomCode").textContent = roomCode;
          const joinUrl = `${location.protocol}//${location.host}/controller.html?room=${roomCode}`;
          new QRCode(document.getElementById("qrcode"), {
            text: joinUrl,
            width: 150,
            height: 150,
          });
        }
        if (msg.type === "player-joined") {
          playerConnected = true;
          document.getElementById("playerStatus").textContent =
            "Player connected ✅";
          document.getElementById("playerStatus").classList.add("ready");
          document.getElementById("startBtn").disabled = false;
        }
        if (msg.type === "player-left") {
          playerConnected = false;
          document.getElementById("playerStatus").textContent =
            "Player disconnected";
          document.getElementById("playerStatus").classList.remove("ready");
          document.getElementById("startBtn").disabled = true;
        }
        if (msg.type === "input") {
          input.lastReceived = Date.now();
          if (msg.joystick) input.move = msg.joystick;
          if (msg.look) {
            input.look.dx += msg.look.dx;
            input.look.dy += msg.look.dy;
          }
          if (msg.action === "shoot") input.shoot = msg.state === "down";
          if (msg.action === "aim") input.aim = msg.state === "down";
          if (msg.action === "reload" && msg.state === "down")
            input.reloadPressed = true;
          if (msg.action === "weapon" && msg.state === "down")
            input.weaponPressed = true;
          if (msg.action === "start" && msg.state === "down")
            input.startPresses++;
          if (msg.action === "grapple") input.grapple = msg.state === "down";
          if (msg.action === "reset") resetInputState();
        }
      };

      const input = {
        move: { x: 0, y: 0 },
        look: { dx: 0, dy: 0 },
        shoot: false,
        aim: false,
        reloadPressed: false,
        weaponPressed: false,
        startPresses: 0,
        grapple: false,
        lastReceived: Date.now(),
      };

      function resetInputState() {
        input.move = { x: 0, y: 0 };
        input.look.dx = 0;
        input.look.dy = 0;
        input.shoot = false;
        input.aim = false;
        input.grapple = false;
        input.reloadPressed = false;
        input.weaponPressed = false;
      }

      // ---------- Canvas / doodle helpers (screen-space HUD overlay) ----------
      const gameWrap = document.getElementById("gameWrap");
      const webglCanvas = document.getElementById("webgl");
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      let W = window.innerWidth,
        H = window.innerHeight;
      // HUD ink stays readable over the bright sky, grass, and building faces.
      const INK = "#14283b";
      // Dramatic HUD accent palette — orange/red, matching the lobby's ember
      // theme — used for panel backgrounds and headline text so the HUD and
      // pause screen read as a tactical readout, without touching the
      // bright comic-book look of the 3D world itself (that stays as-is).
      const HUD_ACCENT = "#ff6a3d";
      const HUD_DANGER = "#ff3b3b";
      const HUD_DARK = "rgba(12, 6, 5, 0.86)";
      // Canvas text doesn't wait for a web font the way DOM text does — draw
      // calls made before Namistre finishes loading would silently fall back
      // to the browser default and then never re-render, so gate on this the
      // same way the game already gates faReady-style icon fonts elsewhere.
      let namistreReady = false;
      if (document.fonts && document.fonts.load) {
        document.fonts
          .load('900 32px "Namistre"')
          .then(() => {
            namistreReady = true;
          })
          .catch(() => {});
      }
      function hudFont(px, weight = "bold") {
        return namistreReady
          ? `${weight} ${px}px "Namistre", monospace`
          : `${weight} ${px}px monospace`;
      }
      function glowText(text, x, y, color, blur) {
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = blur;
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      function jitter(v, amt) {
        return v + (Math.random() - 0.5) * amt;
      }

      function sketchLineColor(
        x1,
        y1,
        x2,
        y2,
        color,
        passes = 2,
        jitterAmt = 1.5,
      ) {
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.4;
        for (let i = 0; i < passes; i++) {
          ctx.beginPath();
          ctx.moveTo(jitter(x1, jitterAmt), jitter(y1, jitterAmt));
          ctx.lineTo(jitter(x2, jitterAmt), jitter(y2, jitterAmt));
          ctx.stroke();
        }
      }

      function sketchLine(x1, y1, x2, y2, passes = 2, jitterAmt = 1.5) {
        sketchLineColor(x1, y1, x2, y2, INK, passes, jitterAmt);
      }

      function sketchCircle(cx, cy, r, passes = 2) {
        ctx.strokeStyle = INK;
        ctx.lineWidth = 1.4;
        for (let i = 0; i < passes; i++) {
          ctx.beginPath();
          ctx.ellipse(
            jitter(cx, 1.2),
            jitter(cy, 1.2),
            r + jitter(0, 1),
            r + jitter(0, 1),
            0,
            0,
            Math.PI * 2,
          );
          ctx.stroke();
        }
      }

      // ---------- Three.js world ----------
      const WORLD_SCALE = 0.05; // keeps the original px-based pacing formulas, at sane 3D-world-unit scale
      const PLAYER_RADIUS = 1.2;
      const EYE_HEIGHT = 1.7;
      const MELEE_RADIUS = 40 * WORLD_SCALE;

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x8ec9e8);
      scene.fog = new THREE.Fog(0x8ec9e8, 72, 190);
      const camera = new THREE.PerspectiveCamera(75, W / H, 0.1, 500);
      camera.rotation.order = "YXZ";
      scene.add(camera); // camera must be in the scene graph for its child (the gun viewmodel) to render
      const renderer = new THREE.WebGLRenderer({
        canvas: webglCanvas,
        antialias: true,
      });
      renderer.setSize(W, H, false);
      renderer.setClearColor(0x8ec9e8, 1);
      renderer.outputEncoding = THREE.sRGBEncoding;
      const raycaster = new THREE.Raycaster();
      scene.add(new THREE.HemisphereLight(0xdff4ff, 0x38533a, 1.4));
      const sunLight = new THREE.DirectionalLight(0xfff0bd, 1.1);
      sunLight.position.set(-45, 75, -35);
      scene.add(sunLight);

      function resizeGame() {
        W = window.innerWidth;
        H = window.innerHeight;
        canvas.width = W;
        canvas.height = H;
        renderer.setSize(W, H, false);
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
      }
      window.addEventListener("resize", () => {
        if (running) resizeGame();
      });

      // Host-side fallback: lets whoever holds the keyboard un-stick a pause even if the
      // phone controller is the one that's disconnected or unresponsive.
      window.addEventListener("keydown", (e) => {
        if ((e.key === "p" || e.key === "P" || e.key === "Escape") && running)
          paused = !paused;
      });

      // ---------- Sound (synthesized — no audio assets to ship) ----------
      let audioCtx = null;
      function ensureAudio() {
        if (!audioCtx) {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          audioCtx = new Ctx();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        return audioCtx;
      }

      function noiseBuffer(ctx, duration) {
        const buffer = ctx.createBuffer(
          1,
          Math.max(1, Math.floor(ctx.sampleRate * duration)),
          ctx.sampleRate,
        );
        const data = buffer.getChannelData(0);
        for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
        return buffer;
      }

      const WEAPON_SOUND = {
        RIFLE: { freq: 1500, duration: 0.09, volume: 0.28, decay: 0.07 },
        SHOTGUN: { freq: 900, duration: 0.18, volume: 0.45, decay: 0.14 },
        SNIPER: { freq: 1800, duration: 0.22, volume: 0.5, decay: 0.2 },
      };

      function playShotSound(weaponName) {
        const { freq, duration, volume, decay } =
          WEAPON_SOUND[weaponName] || WEAPON_SOUND.RIFLE;
        const ctx = ensureAudio();
        const now = ctx.currentTime;

        // filtered noise burst reads as the crack of the shot
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer(ctx, duration);
        const bandpass = ctx.createBiquadFilter();
        bandpass.type = "bandpass";
        bandpass.frequency.value = freq;
        bandpass.Q.value = 0.8;
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(volume, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + decay);
        noise.connect(bandpass).connect(noiseGain).connect(ctx.destination);
        noise.start(now);
        noise.stop(now + duration);

        // a low, fast-decaying thump gives the shot some body
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(freq * 0.15, now);
        osc.frequency.exponentialRampToValueAtTime(
          Math.max(30, freq * 0.05),
          now + decay,
        );
        const oscGain = ctx.createGain();
        oscGain.gain.setValueAtTime(volume * 0.6, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + decay);
        osc.connect(oscGain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + decay);
      }

      function playSlashSound() {
        const ctx = ensureAudio();
        const now = ctx.currentTime;
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer(ctx, 0.15);
        const hp = ctx.createBiquadFilter();
        hp.type = "highpass";
        hp.frequency.setValueAtTime(2500, now);
        hp.frequency.exponentialRampToValueAtTime(700, now + 0.15);
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        noise.connect(hp).connect(gain).connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 0.15);
      }

      function playEnemyDeathSound() {
        const ctx = ensureAudio();
        const now = ctx.currentTime;

        // a falling growl for the "hit" reaction
        const osc = ctx.createOscillator();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(60, now + 0.35);
        const oscGain = ctx.createGain();
        oscGain.gain.setValueAtTime(0.32, now);
        oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        osc.connect(oscGain).connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 0.4);

        // a soft thud for the body hitting the ground
        const noise = ctx.createBufferSource();
        noise.buffer = noiseBuffer(ctx, 0.2);
        const lp = ctx.createBiquadFilter();
        lp.type = "lowpass";
        lp.frequency.value = 500;
        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.25, now);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
        noise.connect(lp).connect(noiseGain).connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 0.2);
      }

      function jitterGeometry(geo, amt) {
        const pos = geo.attributes.position;
        for (let i = 0; i < pos.count; i++) {
          pos.setXYZ(
            i,
            pos.getX(i) + (Math.random() - 0.5) * amt,
            pos.getY(i) + (Math.random() - 0.5) * amt,
            pos.getZ(i) + (Math.random() - 0.5) * amt,
          );
        }
        pos.needsUpdate = true;
      }

      const inkLineMat = new THREE.LineBasicMaterial({ color: 0x21334d });
      const enemyLineMat = new THREE.LineBasicMaterial({ color: 0x6e1821 });

      function makeHatchTexture() {
        const c = document.createElement("canvas");
        c.width = 128;
        c.height = 128;
        const hctx = c.getContext("2d");
        hctx.fillStyle = "#f4f1e8";
        hctx.fillRect(0, 0, 128, 128);
        hctx.strokeStyle = "rgba(34,51,170,0.35)";
        hctx.lineWidth = 2;
        for (let i = -128; i < 128; i += 10) {
          hctx.beginPath();
          hctx.moveTo(i, 0);
          hctx.lineTo(i + 128, 128);
          hctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }
      const hatchBaseTexture = makeHatchTexture();

      function makeGroundTexture() {
        const c = document.createElement("canvas");
        c.width = 256;
        c.height = 256;
        const gctx = c.getContext("2d");
        gctx.fillStyle = "#5f9a67";
        gctx.fillRect(0, 0, 256, 256);
        gctx.fillStyle = "rgba(40,100,55,0.18)";
        for (let i = 0; i < 160; i++) {
          gctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(20, 20);
        return tex;
      }

      const groundMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(400, 400),
        new THREE.MeshLambertMaterial({ map: makeGroundTexture() }),
      );
      groundMesh.rotation.x = -Math.PI / 2;
      scene.add(groundMesh);

      const buildingColliders = [];
      const buildingMeshes = []; // grapple-hook raycast targets
      const buildingRoofs = []; // rooftop footprints enemies can spawn on and descend from
      const buildingAccess = []; // ladders are physical navigation links between street and roof
      const shootableCrates = [];

      // horizontal floor-division lines + window mullions, so buildings read as
      // multi-story structures instead of plain boxes
      function addBuildingDetail(mesh, w, h, d) {
        const floorH = 4.2;
        const floors = Math.max(2, Math.round(h / floorH));
        const hw = w / 2,
          hd = d / 2;
        const pts = [];
        for (let f = 1; f < floors; f++) {
          const y = -h / 2 + f * (h / floors);
          pts.push(new THREE.Vector3(-hw, y, hd), new THREE.Vector3(hw, y, hd));
          pts.push(
            new THREE.Vector3(-hw, y, -hd),
            new THREE.Vector3(hw, y, -hd),
          );
          pts.push(
            new THREE.Vector3(-hw, y, -hd),
            new THREE.Vector3(-hw, y, hd),
          );
          pts.push(new THREE.Vector3(hw, y, -hd), new THREE.Vector3(hw, y, hd));
        }
        const cols = Math.max(2, Math.round(w / 3));
        for (let f = 0; f < floors; f++) {
          const y0 = -h / 2 + f * (h / floors) + (h / floors) * 0.22;
          const y1 = -h / 2 + f * (h / floors) + (h / floors) * 0.78;
          for (let c = 1; c < cols; c++) {
            const x = -hw + (c / cols) * w;
            pts.push(
              new THREE.Vector3(x, y0, hd),
              new THREE.Vector3(x, y1, hd),
            );
            pts.push(
              new THREE.Vector3(x, y0, -hd),
              new THREE.Vector3(x, y1, -hd),
            );
          }
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        jitterGeometry(geo, 0.04);
        mesh.add(new THREE.LineSegments(geo, inkLineMat));

        // Recessed paper-blue window bays give the skyline a crisp, constructed silhouette.
        const windowMat = new THREE.MeshBasicMaterial({
          color: 0xdce5f7,
          transparent: true,
          opacity: 0.72,
          side: THREE.DoubleSide,
        });
        for (let f = 0; f < floors; f++) {
          const wy = -h / 2 + (f + 0.5) * (h / floors);
          for (let c = 0; c < cols; c++) {
            const ww = (w / cols) * 0.58;
            const wh = (h / floors) * 0.42;
            const wx = -hw + (c + 0.5) * (w / cols);
            for (const z of [hd + 0.012, -hd - 0.012]) {
              const pane = new THREE.Mesh(
                new THREE.PlaneGeometry(ww, wh),
                windowMat,
              );
              pane.position.set(wx, wy, z);
              mesh.add(pane);
              const frame = new THREE.EdgesGeometry(
                new THREE.PlaneGeometry(ww, wh),
              );
              pane.add(new THREE.LineSegments(frame, inkLineMat));
            }
          }
        }
      }

      // a low parapet lip around the roof edge, marking it as a ledge enemies stand on
      function addRoofParapet(mesh, w, h, d) {

        ring.position.y = h / 2 + lip / 2;
        mesh.add(ring);
      }

      function createAccessLadder(access) {
        const pts = [];
        const railGap = 0.62;
        for (const side of [-1, 1]) {
          pts.push(
            new THREE.Vector3(access.x, 0, access.z + (side * railGap) / 2),

      // ---------- Props: crates, scaffolding, crane, sky dome ----------
      function createCrate(x, z, size) {
        const geo = new THREE.BoxGeometry(size, size, size);

          geo,

        const collider = {
          minX: x - size / 2,
          maxX: x + size / 2,
          minZ: z - size / 2,
          maxZ: z + size / 2,
        };
        buildingColliders.push(collider);

        mesh.userData.crateRef = crate;

      function breakCrate(crate) {
        if (!crate || crate.broken) return;
        crate.broken = true;
        scene.remove(crate.mesh);
        const meshIndex = buildingMeshes.indexOf(crate.mesh);
        if (meshIndex >= 0) buildingMeshes.splice(meshIndex, 1);
        const targetIndex = shootableCrates.indexOf(crate.mesh);
        if (targetIndex >= 0) shootableCrates.splice(targetIndex, 1);
        const colliderIndex = buildingColliders.indexOf(crate.collider);
        if (colliderIndex >= 0) buildingColliders.splice(colliderIndex, 1);
      }

      // Ground props register a movement collider (kept separate from buildingMeshes
      // so they don't also become grapple targets or block bullet sightlines) — without
      // this, players and enemies alike would walk straight through them.
      function addGroundCollider(x, z, halfW, halfD, rotation = 0) {
        const alongZ = Math.abs(Math.sin(rotation)) > 0.5;
        buildingColliders.push(
          alongZ
            ? {
                minX: x - halfD,
                maxX: x + halfD,
                minZ: z - halfW,
                maxZ: z + halfW,
              }
            : {
                minX: x - halfW,
                maxX: x + halfW,
                minZ: z - halfD,
                maxZ: z + halfD,
              },
        );
      }

      function createScaffold(x, z, w, h, d, rows) {
        const pts = [];
        for (let cx = 0; cx <= 1; cx++) {
          for (let cz = 0; cz <= 1; cz++) {
            const px = x + (cx - 0.5) * w,
              pz = z + (cz - 0.5) * d;
            pts.push(
              new THREE.Vector3(px, 0, pz),
              new THREE.Vector3(px, h, pz),
            );
          }
        }
        for (let r = 0; r < rows; r++) {
          const y = (r / (rows - 1)) * h;
          const corners = [
            [x - w / 2, z - d / 2],
            [x + w / 2, z - d / 2],
            [x + w / 2, z + d / 2],
            [x - w / 2, z + d / 2],
            [x - w / 2, z - d / 2],
          ];
          for (let i = 0; i < corners.length - 1; i++) {
            pts.push(
              new THREE.Vector3(corners[i][0], y, corners[i][1]),
              new THREE.Vector3(corners[i + 1][0], y, corners[i + 1][1]),
            );
          }
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        jitterGeometry(geo, 0.05);
        scene.add(new THREE.LineSegments(geo, inkLineMat));
        addGroundCollider(x, z, w / 2, d / 2);
      }

      function createSkyDome() {
        const radius = 260;
        const meridians = 16,
          meridianSteps = 10,
          rings = 4,
          ringSegs = 48;
        const pts = [];
        for (let i = 0; i < meridians; i++) {
          const theta = (i / meridians) * Math.PI * 2;
          let prev = new THREE.Vector3(0, radius, 0);
          for (let s = 1; s <= meridianSteps; s++) {
            const phi = (s / meridianSteps) * (Math.PI / 2);
            const y = Math.cos(phi) * radius,
              r = Math.sin(phi) * radius;
            const pt = new THREE.Vector3(
              Math.cos(theta) * r,
              y,
              Math.sin(theta) * r,
            );
            pts.push(prev.clone(), pt.clone());
            prev = pt;
          }
        }
        for (let ringIdx = 1; ringIdx <= rings; ringIdx++) {
          const phi = (ringIdx / (rings + 1)) * (Math.PI / 2);
          const y = Math.cos(phi) * radius,
            r = Math.sin(phi) * radius;
          let prev = null;
          for (let s = 0; s <= ringSegs; s++) {
            const theta = (s / ringSegs) * Math.PI * 2;
            const pt = new THREE.Vector3(
              Math.cos(theta) * r,
              y,
              Math.sin(theta) * r,
            );
            if (prev) pts.push(prev.clone(), pt.clone());
            prev = pt;
          }
        }
        const geo = new THREE.BufferGeometry().setFromPoints(pts);
        scene.add(
          new THREE.LineSegments(
            geo,
            new THREE.LineBasicMaterial({
              color: 0x2233aa,
              transparent: true,
              opacity: 0.35,
            }),
          ),
        );
      }

      function makeSunTexture() {
        const c = document.createElement("canvas");
        c.width = 128;
        c.height = 128;
        const sctx = c.getContext("2d");
        sctx.strokeStyle = "#2233aa";
        sctx.lineWidth = 3;
        sctx.beginPath();
        sctx.arc(64, 64, 26, 0, Math.PI * 2);
        sctx.stroke();
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * Math.PI * 2;
          sctx.beginPath();
          sctx.moveTo(64 + Math.cos(a) * 32, 64 + Math.sin(a) * 32);
          sctx.lineTo(64 + Math.cos(a) * 46, 64 + Math.sin(a) * 46);
          sctx.stroke();
        }
        return new THREE.CanvasTexture(c);
      }

        const rightLegPivot = new THREE.Group();
        rightLegPivot.position.set(0.25, 1.02, 0);
        group.add(leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot);
        enemyLimb(0.8, 0.2, leftArmPivot);
        enemyLimb(0.8, 0.2, rightArmPivot);
        enemyLimb(1.05, 0.26, leftLegPivot);
        enemyLimb(1.05, 0.26, rightLegPivot);

        // Rifle is held across the chest at shoulder height. Both hands are children of
        // the gun itself (one back at the grip/trigger, one forward on the handguard)
        // so they stay properly attached to it instead of floating at a fixed spot in
        // space while the gun rocks with aim and walk sway.
        const gun = buildEnemyGun();
        gun.position.set(0, 1.92, 0.25);
        group.add(gun);
        const gunMuzzle = new THREE.Object3D();
        gunMuzzle.position.set(0, 0.08, 1.04);
        gun.add(gunMuzzle);
        for (const [x, y, z] of [
          [0.05, -0.1, 0.3], // trigger hand, back near the receiver
          [-0.03, -0.03, 0.62], // support hand, forward on the handguard
        ]) {
          const hand = enemyPart(
            new THREE.SphereGeometry(0.13, 7, 5),
            gun,
            x,
            y,
            z,
          );
          hand.scale.set(0.9, 1.15, 0.75);
        }

        // separate head/body hitboxes so a headshot can be judged distinctly from a body hit
        const bodyHitMesh = new THREE.Mesh(
          new THREE.SphereGeometry(1, 8, 6),
          new THREE.MeshBasicMaterial({ visible: false }),
        );
        bodyHitMesh.position.y = 1.2;
        group.add(bodyHitMesh);
        const headHitMesh = new THREE.Mesh(
          new THREE.SphereGeometry(0.5, 8, 6),
          new THREE.MeshBasicMaterial({ visible: false }),
        );
        headHitMesh.position.y = 2.55;
        group.add(headHitMesh);

        group.position.set(x, 0, z);
        scene.add(group);

        const enemy = {
          group,
          torso,
          vest,
          gun,
          gunMuzzle,
          hitMesh: bodyHitMesh,
          headHitMesh,
          alive: true,
          speed,
          hp: 160,
          maxHp: 160,
          bulletDamage: 5,
          gunRecoil: 0,
          shootCooldown: 0.4 + Math.random() * 1,
          engageTimer: 0,
          walkT: Math.random() * 10,
          brain: "advance",
          decisionTimer: 0,
          flankSign: Math.random() < 0.5 ? -1 : 1,
          coverPoint: null,
          destination: null,
          roofBuilding: null,
          limbs: { leftArmPivot, rightArmPivot, leftLegPivot, rightLegPivot },
        };
        bodyHitMesh.userData.enemyRef = enemy;
        headHitMesh.userData.enemyRef = enemy;
        headHitMesh.userData.isHead = true;
        return enemy;
      }

      // ---------- Weapons ----------
      // Ammo is a single bullet count per weapon — no separate clip/reserve split.
      // You can fire freely until it hits zero, then it reloads back up to maxAmmo.
      const WEAPONS = [
        {
          name: "RIFLE",
          maxAmmo: 180,
          cooldown: 0.1,
          pellets: 1,
          spread: 0.012,
          melee: false,
          reloadTime: 1.2,
          auto: true,
        },
        {
          name: "SHOTGUN",
          maxAmmo: 36,
          cooldown: 0.6,
          pellets: 8,
          spread: 0.09,
          melee: false,
          reloadTime: 1.6,
          auto: false,
        },
        {
          name: "SNIPER",
          maxAmmo: 25,
          cooldown: 0.9,
          pellets: 1,
          spread: 0,
          melee: false,
          reloadTime: 1.6,
          auto: false,
        },
        {
          name: "KATANA",
          maxAmmo: Infinity,
          cooldown: 0.35,
          pellets: 0,
          spread: 0,
          melee: true,
          meleeRange: 4.5,
          reloadTime: 0,
          auto: false,
        },
      ];
      let weaponIndex = 0;
      let weaponState = WEAPONS.map((w) => ({ ammo: w.maxAmmo }));
      function currentWeapon() {
        return WEAPONS[weaponIndex];
      }
      function cycleWeapon() {
        weaponIndex = (weaponIndex + 1) % WEAPONS.length;
        reloading = false;
        setGunModel(currentWeapon().name);
      }

      // ---------- Gun viewmodel (3D, camera-attached) ----------
      const gunGroup = new THREE.Group();
      const GUN_REST = { x: 0.28, y: -0.28, z: -0.55 };
      gunGroup.position.set(GUN_REST.x, GUN_REST.y, GUN_REST.z);
      gunGroup.rotation.set(0, -0.05, 0);
      camera.add(gunGroup);

      const gunBodyMat = new THREE.MeshLambertMaterial({ color: 0x36455a });
      const gunLineMat = new THREE.LineBasicMaterial({ color: 0x172536 });

      function gunPart(geo, parent, x, y, z, rx = 0, ry = 0, rz = 0) {
        const mesh = new THREE.Mesh(geo, gunBodyMat);
        mesh.position.set(x, y, z);
        mesh.rotation.set(rx, ry, rz);
        const edges = new THREE.EdgesGeometry(geo);
        jitterGeometry(edges, 0.006);
        mesh.add(new THREE.LineSegments(edges, gunLineMat));
        parent.add(mesh);
        return mesh;
      }

      function buildRifleModel() {
        const g = new THREE.Group();
        gunPart(
          new THREE.CylinderGeometry(0.024, 0.03, 0.62, 8),
          g,
          0,
          0.03,
          -0.55,
          Math.PI / 2,
          0,
          0,
        ); // barrel
        gunPart(new THREE.BoxGeometry(0.09, 0.11, 0.4), g, 0, 0, -0.18); // receiver
        gunPart(
          new THREE.BoxGeometry(0.06, 0.09, 0.24),
          g,
          0,
          -0.1,
          0.2,
          0.28,
          0,
          0,
        ); // stock
        gunPart(
          new THREE.BoxGeometry(0.05, 0.18, 0.09),
          g,
          0,
          -0.14,
          -0.12,
          -0.18,
          0,
          0,
        ); // magazine
        gunPart(new THREE.BoxGeometry(0.045, 0.13, 0.07), g, 0, -0.1, 0.04); // grip
        gunPart(new THREE.BoxGeometry(0.04, 0.05, 0.1), g, 0, 0.1, -0.04); // rear sight
        gunPart(new THREE.BoxGeometry(0.03, 0.035, 0.04), g, 0, 0.07, -0.5); // front sight
        return g;
      }

      function buildShotgunModel() {
        const g = new THREE.Group();
        gunPart(
          new THREE.CylinderGeometry(0.034, 0.034, 0.55, 8),
          g,
          0,
          0.04,
          -0.5,
          Math.PI / 2,
          0,
          0,
        ); // barrel
        gunPart(
          new THREE.CylinderGeometry(0.02, 0.02, 0.4, 8),
          g,
          0,
          -0.02,
          -0.42,
          Math.PI / 2,
          0,
          0,
        ); // tube mag
        gunPart(new THREE.BoxGeometry(0.1, 0.1, 0.3), g, 0, 0, -0.06); // receiver
        gunPart(
          new THREE.BoxGeometry(0.07, 0.08, 0.28),
          g,
          0,
          -0.09,
          0.26,
          0.32,
          0,

        ); // stock
        gunPart(new THREE.BoxGeometry(0.08, 0.09, 0.12), g, 0, -0.03, -0.3); // pump foregrip
