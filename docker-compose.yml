services:
  football:
    build: ./football
    container_name: wandr-football
    restart: unless-stopped
    ports:
      - "127.0.0.1:3009:3009"
    environment:
      - PORT=3009

  chicken-invaders:
    build: ./chicken-invaders
    container_name: wandr-chicken-invaders
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
