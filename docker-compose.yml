services:
  football:
    build: ./football
    container_name: wandr-football
    restart: unless-stopped
    ports:
      - "127.0.0.1:3009:3009"
    environment:
      - PORT=3009

  chicken-invaders:
    build: ./chicken-invaders
    container_name: wandr-chicken-invaders
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000

  racing:
    build: ./racing
    container_name: wandr-racing
    restart: unless-stopped
    ports:
      - "127.0.0.1:3010:3010"
    environment:
      - PORT=3010

  last-block:
    build: ./last-block
    container_name: wandr-last-block
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:3011"
    environment:
      - PORT=3011

  fight:
    build: ./fight
    container_name: wandr-fight
    restart: unless-stopped
    ports:
      - "127.0.0.1:3012:3012"
    environment:
      - PORT=3012
